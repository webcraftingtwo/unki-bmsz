<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UNKI GEOTECH — Underground Field App</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   UNKI GEOTECH
   Built for ruggedised tablets underground. Design constraints:
   gloved hands, dust, cap-lamp light, water, time pressure.

   · Nothing below 13px. Body 17px. Data 20–34px.
   · Minimum tap target 60px. Primary actions 68px.
   · Palette taken from the job: BMSZ marking yellow is the
     primary action colour because it is the actual paint on
     the face. Rust = stop/breach. Green = in control.
   · Status is never colour alone — always colour + text.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --bg:#100E0A; --panel:#1A170F; --raised:#241F16; --sunk:#0A0906;
  --line:#3A3325; --line-soft:#2A2418;

  --paint:#FFC61A;        /* BMSZ marking yellow */
  --paint-dim:#5C4707;
  --rust:#E04A2F;         /* breach / stop / hazard */
  --rust-dim:#4A1C12;
  --grow:#5FB87A;         /* in control / cleared */
  --grow-dim:#16301F;
  --teal:#54A296;         /* informational / interpreted */
  --teal-dim:#14282B;

  --text:#F2ECDD; --dim:#B0A692; --faint:#756C58;

  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --tap:60px; --tap-lg:68px;
  --rail:236px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--paint);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ── layout shell ─────────────────────────────────────────── */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.rail{display:none;}
.body{flex:1;min-width:0;display:flex;flex-direction:column;}

header.top{background:linear-gradient(180deg,var(--raised),var(--panel));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  padding:12px 18px;}
.toprow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.mark{font-weight:800;font-size:20px;letter-spacing:.06em;color:var(--paint);
  text-transform:uppercase;line-height:1;}
.mark em{font-style:normal;color:var(--dim);font-weight:500;}
.topmeta{display:flex;align-items:center;gap:14px;margin-left:auto;
  font-family:var(--mono);font-size:13px;color:var(--dim);flex-wrap:wrap;}
.netpill{display:flex;align-items:center;gap:7px;padding:6px 11px;
  border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-size:13px;}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--grow);flex:none;}
.netdot.off{background:var(--rust);}

.wpbar{margin-top:11px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--paint);
  border-radius:7px;padding:11px 14px;}
.wpbar .wpname{font-family:var(--mono);font-size:16px;color:var(--paint);font-weight:600;}
.wpbar .wpsub{font-family:var(--mono);font-size:13px;color:var(--faint);}
.wpbar .spacer{margin-left:auto;}

/* ── tabs (narrow) ────────────────────────────────────────── */
nav.tabs{display:flex;overflow-x:auto;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:29;
  scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:0 0 auto;background:none;border:none;color:var(--faint);
  font-family:var(--mono);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:0 16px;height:var(--tap);border-bottom:3px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:7px;}
nav.tabs button.active{color:var(--paint);border-bottom-color:var(--paint);background:var(--raised);}
nav.tabs button.locked{color:var(--faint);opacity:.45;}
.lockglyph{font-size:12px;}

main{flex:1;padding:20px 18px 120px;max-width:1180px;width:100%;margin:0 auto;}

/* ── wide screens: left rail ──────────────────────────────── */
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;width:var(--rail);flex:none;
    background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;}
  .railhead{padding:20px 18px 16px;border-bottom:1px solid var(--line);}
  .railnav{padding:10px 0;flex:1;}
  .railnav button{width:100%;background:none;border:none;text-align:left;
    color:var(--dim);font-family:var(--mono);font-size:14px;letter-spacing:.04em;
    text-transform:uppercase;padding:0 18px;height:var(--tap);
    display:flex;align-items:center;gap:11px;border-left:4px solid transparent;}
  .railnav button.active{color:var(--paint);border-left-color:var(--paint);background:var(--raised);}
  .railnav button.locked{opacity:.42;}
  .railnav .grp{font-family:var(--mono);font-size:12px;color:var(--faint);
    padding:16px 18px 7px;letter-spacing:.12em;text-transform:uppercase;}
  nav.tabs{display:none;}
  main{padding:26px 30px 130px;}
}

/* ── typography ───────────────────────────────────────────── */
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--teal);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:6px;}
h2.title{font-size:27px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;}
p.sub{color:var(--dim);font-size:16px;margin:0 0 22px;max-width:70ch;}
h3.sec{font-family:var(--mono);font-size:14px;color:var(--paint);text-transform:uppercase;
  letter-spacing:.1em;margin:0 0 14px;font-weight:600;}
.clause{font-family:var(--mono);font-size:12.5px;color:var(--faint);letter-spacing:.03em;}

/* ── cards & forms ────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px;margin-bottom:18px;}
.card.hot{border-color:var(--rust);}
.card.ok{border-color:var(--grow);}
.card.pri{border-color:var(--paint);}
.grid{display:grid;gap:14px;margin-bottom:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:701px) and (max-width:1000px){.g4{grid-template-columns:1fr 1fr;}}

label.f{display:block;font-size:14px;color:var(--dim);margin-bottom:7px;font-weight:500;}
label.f b{color:var(--text);}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{
  width:100%;background:var(--sunk);border:1.5px solid var(--line);color:var(--text);
  padding:0 14px;height:var(--tap);border-radius:7px;font-size:17px;}
textarea{padding:13px 14px;height:auto;min-height:96px;resize:vertical;line-height:1.5;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--paint);background:#0D0B07;}
input.num,.mononum{font-family:var(--mono);font-variant-numeric:tabular-nums;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 20px) 26px,calc(100% - 14px) 26px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:44px;}

/* ── chips ────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{border:1.5px solid var(--line);background:var(--sunk);color:var(--dim);
  font-size:15px;padding:0 18px;height:var(--tap);border-radius:8px;
  display:flex;align-items:center;user-select:none;}
.chip.sel{background:var(--paint-dim);border-color:var(--paint);color:var(--paint);font-weight:600;}
.chip.sel.rust{background:var(--rust-dim);border-color:var(--rust);color:#FFB9A8;}
.chip.sel.grow{background:var(--grow-dim);border-color:var(--grow);color:var(--grow);}

/* ── buttons ──────────────────────────────────────────────── */
.btn{width:100%;height:var(--tap-lg);border-radius:9px;border:1.5px solid var(--paint);
  background:var(--paint);color:#161200;font-family:var(--mono);font-weight:700;
  font-size:15px;letter-spacing:.07em;text-transform:uppercase;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:9px;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.35;pointer-events:none;}
.btn.ghost{background:none;color:var(--dim);border-color:var(--line);}
.btn.danger{background:var(--rust);border-color:var(--rust);color:#fff;}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#08201D;}
.btn.sm{height:var(--tap);font-size:14px;width:auto;padding:0 20px;margin-top:0;}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;}
.btnrow .btn{width:auto;flex:1;min-width:180px;}

/* ── checklist ────────────────────────────────────────────── */
.check{display:flex;align-items:flex-start;gap:14px;padding:15px 16px;
  border:1.5px solid var(--line);border-radius:9px;margin-bottom:10px;background:var(--sunk);
  min-height:var(--tap);}
.check.on{border-color:var(--grow);background:var(--grow-dim);}
.check.fail{border-color:var(--rust);background:var(--rust-dim);}
.check .box{width:30px;height:30px;border:2px solid var(--line);border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
  color:transparent;margin-top:1px;}
.check.on .box{border-color:var(--grow);background:var(--grow);color:#08200F;}
.check.fail .box{border-color:var(--rust);background:var(--rust);color:#fff;}
.check .txt{flex:1;font-size:16px;line-height:1.45;}
.check .txt small{display:block;color:var(--faint);font-size:13px;margin-top:4px;
  font-family:var(--mono);}
.check .flag{background:none;border:1.5px solid var(--line);color:var(--faint);
  border-radius:7px;height:42px;padding:0 13px;font-family:var(--mono);font-size:12.5px;
  text-transform:uppercase;flex:none;}
.check.fail .flag{border-color:var(--rust);color:#FFB9A8;}

/* ── notices ──────────────────────────────────────────────── */
.note{border-radius:9px;padding:15px 17px;font-size:15.5px;line-height:1.55;
  margin-bottom:18px;display:flex;gap:13px;align-items:flex-start;}
.note .mk{font-family:var(--mono);font-size:20px;line-height:1.1;flex:none;font-weight:700;}
.note.stop{border:1.5px solid var(--rust);background:var(--rust-dim);color:#FFC9BC;}
.note.stop .mk{color:var(--rust);}
.note.info{border:1.5px solid var(--teal);background:var(--teal-dim);color:#B4DDD6;}
.note.info .mk{color:var(--teal);}
.note.go{border:1.5px solid var(--grow);background:var(--grow-dim);color:#B9E5C6;}
.note.go .mk{color:var(--grow);}
.note.warn{border:1.5px solid var(--paint);background:#33280A;color:#FFE0A0;}
.note.warn .mk{color:var(--paint);}
.note b{color:#fff;}

/* ── data display ─────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 14px;}
.stat.hot{border-color:var(--rust);}
.stat .num{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--paint);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.stat.hot .num{color:var(--rust);}
.stat .lbl{font-family:var(--mono);font-size:12.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin-top:6px;}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin-bottom:18px;}
table{width:100%;border-collapse:collapse;font-size:15.5px;}
th{background:var(--raised);font-family:var(--mono);font-size:12.5px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:13px 14px;font-weight:600;
  white-space:nowrap;}
td{padding:13px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;}
tr.breach td{background:#2A130E;}
td.n{font-family:var(--mono);}

.item{border:1.5px solid var(--line);border-radius:9px;padding:15px 16px;margin-bottom:11px;
  background:var(--panel);}
.item.hot{border-color:var(--rust);}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
.item .it{font-family:var(--mono);font-size:16px;color:var(--paint);font-weight:600;}
.item .ts{font-family:var(--mono);font-size:13px;color:var(--faint);}
.item .ib{font-size:15px;color:var(--dim);line-height:1.6;}
.item .ib b{color:var(--text);}

.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:5px;font-weight:600;}
.tag.pend{background:#33280A;color:var(--paint);border:1px solid var(--paint-dim);}
.tag.sync{background:var(--grow-dim);color:var(--grow);border:1px solid var(--grow);}
.tag.stop{background:var(--rust-dim);color:#FFB9A8;border:1px solid var(--rust);}
.tag.info{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal);}

.empty{text-align:center;padding:46px 20px;color:var(--faint);font-size:16px;
  font-family:var(--mono);border:1.5px dashed var(--line);border-radius:10px;}

/* ── module grid ──────────────────────────────────────────── */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.mod{background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:18px 16px;
  text-align:left;color:var(--text);min-height:130px;display:flex;flex-direction:column;}
.mod:active{background:var(--raised);}
.mod.locked{opacity:.42;}
.mod .mi{font-family:var(--mono);font-size:12.5px;color:var(--teal);text-transform:uppercase;
  letter-spacing:.08em;}
.mod .mn{font-size:19px;font-weight:700;margin-top:8px;line-height:1.25;}
.mod .mc{font-family:var(--mono);font-size:26px;color:var(--paint);margin-top:auto;padding-top:12px;
  font-variant-numeric:tabular-nums;}
.mod.locked .mc{color:var(--faint);font-size:14px;}

/* ── gate strip ───────────────────────────────────────────── */
.gates{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--panel);flex-wrap:wrap;}
.gate{flex:1;min-width:130px;padding:13px 14px;border-right:1px solid var(--line);}
.gate:last-child{border-right:none;}
.gate .gn{font-family:var(--mono);font-size:12px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;}
.gate .gs{font-family:var(--mono);font-size:14.5px;margin-top:5px;font-weight:600;}
.gate.done .gs{color:var(--grow);}
.gate.open .gs{color:var(--paint);}
.gate.shut .gs{color:var(--faint);}

/* ── SOS floating button ──────────────────────────────────── */
.sos{position:fixed;right:22px;bottom:22px;width:86px;height:86px;border-radius:50%;
  background:var(--rust);border:3px solid #FF7C60;color:#fff;font-family:var(--mono);
  font-weight:800;font-size:15px;letter-spacing:.05em;z-index:50;
  box-shadow:0 8px 26px rgba(0,0,0,.65),0 0 0 0 rgba(224,74,47,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  animation:sospulse 2.6s ease-out infinite;}
.sos .g{font-size:26px;line-height:1;}
.sos:active{transform:scale(.94);}
@keyframes sospulse{0%{box-shadow:0 8px 26px rgba(0,0,0,.65),0 0 0 0 rgba(224,74,47,.5);}
  70%{box-shadow:0 8px 26px rgba(0,0,0,.65),0 0 0 22px rgba(224,74,47,0);}
  100%{box-shadow:0 8px 26px rgba(0,0,0,.65),0 0 0 0 rgba(224,74,47,0);}}
@media (max-width:600px){.sos{width:74px;height:74px;right:16px;bottom:16px;font-size:13px;}
  .sos .g{font-size:22px;}}

/* ── flash toast ──────────────────────────────────────────── */
.flash{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--grow);
  color:#08200F;font-family:var(--mono);font-size:15px;font-weight:700;padding:14px 26px;
  border-radius:9px;z-index:90;opacity:0;transition:opacity .22s;pointer-events:none;
  box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
.flash.show{opacity:1;}
.flash.bad{background:var(--rust);color:#fff;}

/* ── modal ────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(6,5,3,.86);z-index:80;display:flex;
  align-items:flex-end;justify-content:center;padding:0;}
@media (min-width:700px){.scrim{align-items:center;padding:24px;}}
.sheet{background:var(--panel);border:1.5px solid var(--rust);border-radius:14px 14px 0 0;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:22px 20px 30px;}
@media (min-width:700px){.sheet{border-radius:14px;}}

/* ── full screen stages ───────────────────────────────────── */
.stage{min-height:100vh;display:flex;flex-direction:column;padding:34px 22px 60px;
  background:radial-gradient(ellipse at 50% 0%,#231E14,#0B0A06);}
.stagebox{width:100%;max-width:620px;margin:0 auto;}
.brandbig{text-align:center;margin-bottom:28px;}
.brandbig .b1{font-size:34px;font-weight:800;color:var(--paint);letter-spacing:.07em;
  text-transform:uppercase;line-height:1;}
.brandbig .b2{font-family:var(--mono);font-size:14px;color:var(--faint);letter-spacing:.14em;
  margin-top:10px;text-transform:uppercase;}
.pick{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:0 18px;min-height:var(--tap-lg);border:1.5px solid var(--line);border-radius:9px;
  margin-bottom:11px;background:var(--sunk);width:100%;text-align:left;color:var(--text);}
.pick:active{background:var(--raised);}
.pick.sel{border-color:var(--paint);background:var(--paint-dim);}
.pick b{font-family:var(--mono);font-size:16px;font-weight:600;}
.pick span{font-family:var(--mono);font-size:13px;color:var(--faint);}

/* ── re-entry board ───────────────────────────────────────── */
.rec{border:1.5px solid var(--line);border-left:5px solid var(--faint);border-radius:9px;
  padding:16px;margin-bottom:12px;background:var(--panel);width:100%;text-align:left;color:var(--text);}
.rec.cleared{border-left-color:var(--grow);}
.rec.held{border-left-color:var(--rust);}
.rec.pending{border-left-color:var(--paint);}
.rec.sel{border-color:var(--paint);background:var(--raised);}
.rec .rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.rec .rn{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--paint);}
.rec .rm{font-family:var(--mono);font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.7;}
.rec .rm b{color:var(--text);}
.taskchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.tchip{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  padding:5px 10px;border-radius:5px;background:var(--teal-dim);color:var(--teal);
  border:1px solid var(--teal);font-weight:600;}
.tchip.mk{background:var(--paint-dim);color:var(--paint);border-color:var(--paint);}

/* ── section view ─────────────────────────────────────────── */
.svgbox{background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  padding:14px 8px 6px;margin-bottom:18px;}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
  font-family:var(--mono);font-size:12.5px;color:var(--faint);padding:8px 4px 2px;}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;}

/* ── keypad ───────────────────────────────────────────────── */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pad button{height:var(--tap-lg);border-radius:9px;background:var(--raised);
  border:1.5px solid var(--line);color:var(--text);font-family:var(--mono);
  font-size:23px;font-weight:600;}
.pad button:active{background:var(--paint-dim);}
.pad button.act{background:var(--paint);color:#161200;border-color:var(--paint);
  font-size:14px;letter-spacing:.06em;font-weight:800;}
.pad button.sm{font-size:14px;letter-spacing:.05em;color:var(--dim);}

.field{width:100%;text-align:left;border-radius:9px;padding:14px 16px;background:var(--sunk);
  border:2px solid var(--line);color:var(--text);margin-bottom:11px;}
.field.act{border-color:var(--paint);background:var(--raised);}
.field.bad{border-color:var(--rust);}
.field .fl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;
  color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}

/* ═══ 5 · STORAGE ═════════════════════════════════════════════════════ */

function nowTS(){ return new Date().toISOString(); }
function fmtTS(iso){ if(!iso) return '—'; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'})+' '+
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtT(iso){ if(!iso) return '—'; return new Date(iso)
  .toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── UI copy switch ───────────────────────────────────────────────────
   Background copy — why the app or the standard works a certain way —
   is hidden for now. Nothing is deleted: flip SHOW_HELP to true to
   bring every block back at once.

   Only background copy goes through help(). Anything that tells the
   technician what to DO, or states a requirement, is NEVER wrapped and
   always shows: the R4 continuous-marking block and the marking
   instruction (§9.6.3, §9.7), safety stop notes (§9.5), the
   second-opinion accountability note (§9.1), the 3 m structures
   requirement (§9.3), over-break breach warnings, gate-lock warnings,
   keypad instructions and clause citations on checklist items. */
const SHOW_HELP = false;
const help = html => SHOW_HELP ? html : '';
function flash(msg,bad){ const f=document.getElementById('flash'); if(!f)return;
  f.textContent=msg; f.className='flash show'+(bad?' bad':'');
  clearTimeout(f._t); f._t=setTimeout(()=>f.className='flash'+(bad?' bad':''),1800); }
function num(v){ if(v===''||v==null||v==='-') return null; const n=parseFloat(v);
  return isNaN(n)?null:n; }

const HAS_STORE = (typeof window!=='undefined' && window.storage &&
                  typeof window.storage.set==='function');
const memStore = {};
async function put(key,val){
  if(!HAS_STORE){ memStore[key]=JSON.stringify(val); return true; }
  try{ await window.storage.set(PFX+':'+key, JSON.stringify(val), false); return true; }
  catch(e){ console.error('store',e); return false; }
}
async function get(key){
  if(!HAS_STORE){ const v=memStore[key]; return v?JSON.parse(v):null; }
  try{ const r=await window.storage.get(PFX+':'+key,false);
       return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
}
async function saveEntry(kind,data){
  const e = { id:uid(), ts:nowTS(), by:session?session.name:'unknown',
              byNo:session?session.employeeNo:'', shiftId:shift?shift.id:null,
              place: place?{level:place.level,section:place.section,bord:place.bord,
                            blastNumber:place.blastNumber}:null,
              synced:false, ...data };
  const ok = await put(kind+':'+e.id, e);
  cache[kind].unshift(e);
  flash(ok?'Saved locally':'Saved to memory — storage unavailable', !ok);
  return e;
}
async function updateEntry(kind,e){ await put(kind+':'+e.id, e); }

async function loadAll(){
  if(!HAS_STORE) return;
  for(const k of KINDS){
    try{
      const list = await window.storage.list(PFX+':'+k+':', false);
      const out=[];
      if(list&&list.keys) for(const key of list.keys){
        try{ const r=await window.storage.get(key,false); if(r&&r.value) out.push(JSON.parse(r.value)); }catch(e){}
      }
      out.sort((a,b)=> new Date(b.ts)-new Date(a.ts));
      cache[k]=out;
    }catch(e){ cache[k]=[]; }
  }
}
const online = ()=> navigator.onLine;
function pending(){ let n=0; KINDS.forEach(k=>cache[k].forEach(e=>{ if(!e.synced) n++; })); return n; }

async function syncNow(){
  if(!online()){ flash('Offline — '+pending()+' record(s) held on device',true); return; }
  let n=0;
  for(const k of KINDS) for(const e of cache[k])
    if(!e.synced){ e.synced=true; e.syncedAt=nowTS(); await updateEntry(k,e); n++; }
  flash(n? 'Synced '+n+' record(s) to MRM' : 'Already up to date');
  render();
}
/* ═══ 6 · SHIFT & GATE MODEL ══════════════════════════════════════════
   The procedure is a locked chain. A gate cannot open until the previous
   one is fully satisfied. This is the "no loopholes" requirement — the
   technician physically cannot reach the marking screen without the SHE
   and access record being complete and attributable. */

function newShift(){
  return {
    id:uid(), date:new Date().toISOString().slice(0,10), startedAt:nowTS(), endedAt:null,
    shiftName:'Morning', tickSheetRef:'',
    register:{}, ppe:{}, tools:{}, transport:{}, xrf:{},
    defects:'', risksAck:false,
    team:[], teamInstructed:false,
    placeId:null, access:{}, readiness:{}, accessAt:null, accessBy:'',
    signout:{}, xrfDownloaded:false, tallyUpdated:false, deviation:null,
  };
}
const allDone = (obj,list)=> list.every(x=>obj[x[0]]===true);

function gates(){
  const s = shift;
  if(!s) return {pre:'shut',access:'shut',capture:'shut',out:'shut'};
  const pre = s.risksAck && s.teamInstructed &&
              allDone(s.register,REGISTER) && allDone(s.ppe,PPE) &&
              allDone(s.tools,TOOLS) && allDone(s.transport,TRANSPORT) &&
              allDone(s.xrf,XRF_PREP);
  const acc = pre && !!place && allDone(s.access,ACCESS) && allDone(s.readiness,READINESS);
  const logs = cache.faceLog.filter(e=>e.shiftId===s.id).length;
  const marks= cache.bmsz.filter(e=>e.shiftId===s.id).length;
  const offs = cache.offsetSet.filter(e=>e.shiftId===s.id).length;
  return {
    pre:    pre?'done':'open',
    access: acc?'done':(pre?'open':'shut'),
    capture:acc?(logs&&marks&&offs?'done':'open'):'shut',
    out:    (acc&&logs&&marks&&offs)?'open':'shut',
    counts:{logs,marks,offs},
  };
}
const unlocked = v => {
  const g = gates();
  if(['dash','preshift','team','hazard','note','reports'].includes(v)) return true;
  if(v==='access') return g.pre==='done';
  if(['facelog','bmsz','offsets','structure'].includes(v)) return g.access==='done';
  if(v==='signout') return g.out==='open';
  return true;
};

    stage='reentry'; renderShell();

function recCard(r){
  const st=r.reentry.status, ok=st==='cleared';
  const mk=(r.minerTask.tasks||[]).includes('face_marking');
  const gas=r.reentry.gas;
  return `<div class="rec ${st}">
    <div class="rh">
      <span class="rn">${esc(r.bord)}</span>
      <span class="tag ${ok?'sync':st==='held'?'stop':'pend'}">${ok?'cleared for entry':st==='held'?'held — do not enter':'awaiting examination'}</span>
    </div>
    <div class="rm">
      ${esc(r.level)} · ${esc(r.section)} Section · ${esc(LIMITS[r.headingType].label)}<br>
      Blast <b>${esc(r.blastNumber)}</b> at ${fmtTS(r.blastAt)} · advance <b>${r.advance} m</b><br>
      Face <b>${r.face.length} m</b> long · <b>${r.face.width} m</b> wide · <b>${r.face.height} m</b> high<br>
      ${ok?`Cleared by <b>${esc(r.reentry.clearedBy)}</b> at ${fmtT(r.reentry.clearedAt)}`
          :`<b style="color:var(--rust)">${esc(r.reentry.note)}</b>`}
      ${gas?`<br>Gas: CH₄ <b>${gas.ch4}%</b> · CO <b>${gas.co} ppm</b>`:''}
    </div>
    <div class="taskchips">
      ${(r.minerTask.tasks||[]).map(t=>`<span class="tchip ${t==='face_marking'?'mk':''}">${t.replace('_',' ')}</span>`).join('')
        || '<span class="tchip" style="background:none;color:var(--faint);border-color:var(--line)">no task selected</span>'}
    </div>
    ${r.minerTask.selectedBy?`<div class="rm" style="margin-top:8px">Selected by <b>${esc(r.minerTask.selectedBy)}</b> at ${fmtT(r.minerTask.selectedAt)}</div>`:''}
    <button class="btn ${mk?'':'ghost'} sm" style="width:100%;margin-top:14px" data-open="${r.id}" ${ok?'':'disabled'}>
      ${ok?(mk?'Open — start procedure':'Open workplace'):'Locked by re-entry'}
    </button>
  </div>`;
}

async function openPlace(id){
  const r = reentryFeed.find(x=>x.id===id);
  if(!r || !canOpen(r)){ flash('Workplace not cleared for entry',true); return; }
  place = {
    reentryId:r.id, level:r.level, section:r.section, bord:r.bord,
    headingType:r.headingType, blastNumber:r.blastNumber, blastAt:r.blastAt,
    advance:r.advance, peg:r.peg, pegDistance:r.pegDistance,
    faceLength:r.face.length, faceWidth:r.face.width, faceHeight:r.face.height,
    clearedBy:r.reentry.clearedBy, clearedAt:r.reentry.clearedAt,
    minerTasks:r.minerTask.tasks, minerBy:r.minerTask.selectedBy,
  };
  shift.placeId = r.id;
  await put('place', place); await put('shift:current', shift);
  stage='app'; VIEW = gates().pre==='done' ? 'access' : 'preshift';
  renderShell();
}

function checkRow(groupKey,key,label,clause,state,failable){
  const on = state[key]===true, bad = state[key]==='fail';
  return `<div class="check ${on?'on':bad?'fail':''}" data-grp="${groupKey}" data-k="${esc(key)}">
    <div class="box">✓</div>
    <div class="txt">${esc(label)}<small>${esc(clause)}</small></div>
    ${failable?`<button class="flag" data-fail="${esc(key)}" data-grp="${groupKey}">${bad?'Reported':'Report'}</button>`:''}
  </div>`;
}
function checkGroup(title,groupKey,list,state,failable){
  const done=list.filter(x=>state[x[0]]===true).length;
  return `<div class="card ${done===list.length?'ok':''}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
      <h3 class="sec" style="margin-bottom:14px">${title}</h3>
      <span class="clause">${done} / ${list.length}</span>
    </div>
    ${list.map(x=>checkRow(groupKey,x[0],x[0],x[1],state,failable)).join('')}
    <button class="btn ghost sm" style="width:100%;margin-top:10px" data-all="${groupKey}">Confirm all checked</button>
  </div>`;
}

function wireChecks(root){
  root.querySelectorAll('.check[data-grp]').forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.dataset.fail!==undefined) return;
      const g=el.dataset.grp, k=el.dataset.k;
      shift[g][k] = shift[g][k]===true ? undefined : true;
      put('shift:current',shift); render();
    };
  });
  root.querySelectorAll('[data-fail]').forEach(b=>{
    b.onclick=(ev)=>{ ev.stopPropagation();
      const g=b.dataset.grp,k=b.dataset.fail;
      shift[g][k] = shift[g][k]==='fail' ? undefined : 'fail';
      put('shift:current',shift); render();
      flash('Defect recorded — report to supervisor',true);
    };
  });
  root.querySelectorAll('[data-all]').forEach(b=>{
    b.onclick=()=>{
      const g=b.dataset.all;
      const src={register:REGISTER,ppe:PPE,tools:TOOLS,transport:TRANSPORT,xrf:XRF_PREP,
                 access:ACCESS,readiness:READINESS}[g];
      src.forEach(x=>{ if(shift[g][x[0]]!=='fail') shift[g][x[0]]=true; });
      put('shift:current',shift); render();
    };
  });
}

/* ═══ 14 · BLAST OFFSET RECORD ════════════════════════════════════════

   THE CORE MODULE.

   An "offset" here is the deviation of the blasted profile from the
   design cut — over-break and under-break caused by the blast. It is not
   geological displacement; faults and dykes are recorded separately under
   Structures.

   Measurement geometry is fixed by §9.8:
     · taken 1 m from the face
     · first station 1 m from the sidewall
     · collected down-dip side → up-dip side
     · stations at 2 m intervals (§9.8.iv — but the supplied sheets are
       at 1 m, open decision 12.1, so both are offered)
     · 50 m tape stretched top to bottom of bord and taut, then distometer
       or 5 m tape used for each reading                                   */

const SG = 3.1;   // pyroxenite specific gravity, t/m³ — configurable
let OS = null;    // working offset set

function newOffsetSet(){
  const lim = LIMITS[place.headingType];
  const iv  = 1;
  const n   = Math.max(2, Math.floor(place.faceLength/iv)+1);
  return { interval:iv, headingType:place.headingType, faceLength:place.faceLength,
           advance:place.advance, blastNumber:place.blastNumber,
           hwLimit:lim.hw, fwLimit:lim.fw,
           stations:Array.from({length:n},()=>({hw:'',fw:'',cause:'',note:''})),
           active:0, field:'hw', tapeTaut:false, downdipFirst:false };
}
function rebuildStations(iv){
  const n=Math.max(2,Math.floor(OS.faceLength/iv)+1);
  const old=OS.stations;
  OS.interval=iv;
  OS.stations=Array.from({length:n},(_,i)=>old[i*(iv===2?2:1)]||{hw:'',fw:'',cause:'',note:''});
  OS.active=0; OS.field='hw';
}
function osStats(){
  let hwB=0,fwB=0,done=0,over=0,ex=[],widths=[];
  const planned = OS.hwLimit - OS.fwLimit;
  OS.stations.forEach(s=>{
    const hw=num(s.hw), fw=num(s.fw);
    if(hw!=null&&hw>OS.hwLimit){ hwB++; over+=hw-OS.hwLimit; }
    if(fw!=null&&fw<OS.fwLimit) fwB++;
    if(hw!=null&&fw!=null){ done++; const w=hw-fw; widths.push(w); ex.push(w-planned); }
  });
  const meanW = widths.length?widths.reduce((a,b)=>a+b,0)/widths.length:null;
  const meanEx= ex.length?ex.reduce((a,b)=>a+b,0)/ex.length:null;
  const vol   = meanEx!=null?Math.max(0,meanEx)*OS.faceLength*(OS.advance||0):null;
  return {hwB,fwB,done,total:OS.stations.length,planned,
          meanOver:hwB?over/hwB:0, meanW, meanEx,
          dilution: meanEx!=null&&planned>0 ? (meanEx/planned)*100 : null,
          wasteVol:vol, wasteT: vol!=null?vol*SG:null};
}

function sectionSVG(){
  const W=900,H=340,PL=64,PR=22,PY=30;
  const top=Math.max(OS.hwLimit+0.6, ...OS.stations.map(s=>num(s.hw)||0))+0.35;
  const bot=Math.min(OS.fwLimit-0.4, ...OS.stations.map(s=>num(s.fw)||0))-0.25;
  const n=Math.max(OS.stations.length,2);
  const X=i=>PL+i*(W-PL-PR)/(n-1);
  const Y=v=>PY+((top-v)/(top-bot))*(H-PY*2-24);
  const line=(sel)=>{let d='',open=false;
    OS.stations.forEach((s,i)=>{const v=num(s[sel]); if(v==null){open=false;return;}
      d+=(open?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)+' '; open=true;}); return d;};
  const ticks=[]; for(let v=Math.ceil(top*2)/2; v>=bot; v-=0.5) ticks.push(+v.toFixed(2));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="Face section showing hangingwall and footwall offsets against design limits">
    ${ticks.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2A2418"/>
      <text x="${PL-10}" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="#756C58"
        font-family="monospace">${v.toFixed(2)}</text>`).join('')}
    <rect x="${PL}" y="${Y(OS.hwLimit)}" width="${W-PL-PR}" height="${Math.max(0,Y(OS.fwLimit)-Y(OS.hwLimit))}"
      fill="#5FB87A" opacity="0.07"/>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(OS.hwLimit)}" y2="${Y(OS.hwLimit)}" stroke="#E04A2F"
      stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="${W-PR}" y="${Y(OS.hwLimit)-9}" text-anchor="end" font-size="13" fill="#E04A2F"
      font-family="monospace" letter-spacing="1">DESIGN CUT — H/W ${OS.hwLimit.toFixed(2)}</text>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(OS.fwLimit)}" y2="${Y(OS.fwLimit)}" stroke="#E04A2F"
      stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="${W-PR}" y="${Y(OS.fwLimit)+20}" text-anchor="end" font-size="13" fill="#E04A2F"
      font-family="monospace" letter-spacing="1">DESIGN CUT — F/W ${OS.fwLimit.toFixed(2)}</text>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(0)}" y2="${Y(0)}" stroke="#FFC61A" stroke-width="4"/>
    <text x="${PL+6}" y="${Y(0)-11}" font-size="14" fill="#FFC61A" font-weight="700"
      font-family="monospace" letter-spacing="2">BMSZ</text>
    <path d="${line('hw')}" fill="none" stroke="#F2ECDD" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${line('fw')}" fill="none" stroke="#B0A692" stroke-width="2.5" stroke-linejoin="round"/>
    ${OS.stations.map((s,i)=>{
      const hw=num(s.hw),fw=num(s.fw),on=i===OS.active;
      const hb=hw!=null&&hw>OS.hwLimit, fb=fw!=null&&fw<OS.fwLimit;
      return `${on?`<rect x="${X(i)-19}" y="${PY-6}" width="38" height="${H-PY*2-16}" fill="#FFC61A" opacity="0.09"/>`:''}
        ${hw!=null?`<circle cx="${X(i)}" cy="${Y(hw)}" r="${on?9:6.5}" fill="${hb?'#E04A2F':'#5FB87A'}" stroke="#100E0A" stroke-width="2.5"/>`:''}
        ${fw!=null?`<circle cx="${X(i)}" cy="${Y(fw)}" r="${on?9:6.5}" fill="${fb?'#E04A2F':'#5FB87A'}" stroke="#100E0A" stroke-width="2.5"/>`:''}
        <text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="13" font-family="monospace"
          fill="${on?'#FFC61A':'#756C58'}" font-weight="${on?700:400}">${(i*OS.interval)}</text>`;
    }).join('')}
    <text x="${PL}" y="${H-8}" font-size="12" fill="#756C58" font-family="monospace"
      text-anchor="end" transform="translate(-14,0)">m</text>
  </svg>`;
}

      <div class="ib">Over-break <b>${e.stats.hwB} H/W · ${e.stats.fwB} F/W</b> ·
        mean stope width <b>${e.stats.meanW!=null?e.stats.meanW.toFixed(2):'—'} m</b> against design
        <b>${e.stats.planned.toFixed(2)} m</b>${e.stats.dilution!=null?' · <b>'+e.stats.dilution.toFixed(0)+'%</b> over cut':''}</div>
      <div style="margin-top:9px">${e.synced?'<span class="tag sync">synced</span>':'<span class="tag pend">held on device</span>'}</div>
    </div>`).join('')}`:''}`;

  main.querySelectorAll('[data-os]').forEach(el=>el.onclick=()=>{
    OS[el.dataset.os]=!OS[el.dataset.os]; render(); });
  main.querySelectorAll('[data-iv]').forEach(b=>b.onclick=()=>{ rebuildStations(+b.dataset.iv); render(); });
  main.querySelector('#ht').onchange=e=>{
    OS.headingType=e.target.value; OS.hwLimit=LIMITS[e.target.value].hw;
    OS.fwLimit=LIMITS[e.target.value].fw; render(); };
  main.querySelectorAll('[data-fld]').forEach(b=>b.onclick=()=>{ OS.field=b.dataset.fld; render(); });
  main.querySelector('#prev').onclick=()=>{ OS.active=Math.max(0,OS.active-1); OS.field='hw'; render(); };
  main.querySelector('#next').onclick=()=>{ OS.active=Math.min(OS.stations.length-1,OS.active+1); OS.field='hw'; render(); };
  main.querySelectorAll('#cause .chip').forEach(b=>b.onclick=()=>{
    cur.cause = cur.cause===b.dataset.c ? '' : b.dataset.c; render(); });

  main.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, f=OS.field;
    if(k==='next'){ if(f==='hw') OS.field='fw';
      else { OS.field='hw'; OS.active=Math.min(OS.stations.length-1,OS.active+1); } }
    else if(k==='clear') cur[f]='';
    else if(k==='back') cur[f]=String(cur[f]).slice(0,-1);
    else if(k==='−') cur[f]=String(cur[f]).startsWith('-')?String(cur[f]).slice(1):'-'+cur[f];
    else if(k==='.') cur[f]=String(cur[f]).includes('.')?cur[f]:(cur[f]===''?'0':cur[f])+'.';
    else cur[f]=(cur[f]==='0'?'':cur[f])+k;
    render();
  });

  main.querySelector('#loadNS3').onclick=()=>{
    OS.headingType='decline'; OS.hwLimit=1.50; OS.fwLimit=-1.00;
    OS.faceLength=7.2; OS.advance=2.1; OS.interval=1; OS.blastNumber='09';
    const hw=[2.45,2.47,2.51,2.43,2.42,2.44,2.46,2.43];
    const fw=[-1.32,-1.34,-1.32,-1.37,-1.34,-1.38,-1.37,-1.36];
    OS.stations=hw.map((h,i)=>({hw:String(h),fw:String(fw[i]),cause:'',note:''}));
    OS.active=0; OS.field='hw'; OS.tapeTaut=true; OS.downdipFirst=true;
    render(); flash('NS3 12-07-10 loaded — every station over the cut');
  };

  main.querySelector('#saveOS').onclick=async()=>{
    if(!OS.tapeTaut||!OS.downdipFirst){ flash('Confirm tape set-up and direction first',true); return; }
    const miss=OS.stations.some((s,i)=>{
      const h=num(s.hw),f=num(s.fw);
      return ((h!=null&&h>OS.hwLimit)||(f!=null&&f<OS.fwLimit)) && !s.cause; });
    if(miss){ flash('Every over-break station needs a cause',true); return; }
    await saveEntry('offsetSet',{blastNumber:OS.blastNumber, headingType:OS.headingType,
      interval:OS.interval, faceLength:OS.faceLength, advance:OS.advance,
      hwLimit:OS.hwLimit, fwLimit:OS.fwLimit,
      stations:OS.stations.map((s,i)=>({dist:i*OS.interval, hw:num(s.hw), fw:num(s.fw),
        width:(num(s.hw)!=null&&num(s.fw)!=null)?+(num(s.hw)-num(s.fw)).toFixed(2):null,
        cause:s.cause})),
      stats:osStats()});
    OS=newOffsetSet(); render();
  };
}

   Floating, always reachable, on every screen including locked ones.

function renderSOS(){
  const old=document.getElementById('scrim'); if(old) old.remove();
  if(!sosOpen) return;
  const d=document.createElement('div');
  d.className='scrim'; d.id='scrim';
  d.innerHTML=`<div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2 class="title" style="color:var(--rust)">Hazard</h2>
      <button class="btn ghost sm" id="hzClose">Close</button>
    </div>
    <p class="sub" style="margin-bottom:18px">Record it here, then report it through the mine's
      formal hazard channel. This app does not replace that system.</p>

    <div class="note stop"><span class="mk">!</span><div>
      If there is immediate danger, <b>leave the workplace and alert the miner in charge first</b>.
      Record it afterwards.</div></div>

    <label class="f">Hazard type</label>
    <div class="chips" id="hzT">${HAZ_TYPES.map(h=>
      `<button class="chip" data-v="${esc(h)}" style="height:auto;padding:12px 15px;font-size:14.5px">${esc(h)}</button>`).join('')}</div>

    <label class="f" style="margin-top:18px">Severity</label>
    <div class="chips" id="hzS">
      <button class="chip" data-v="High">High — stop work</button>
      <button class="chip" data-v="Medium">Medium</button>
      <button class="chip" data-v="Low">Low</button>
    </div>

    <label class="f" style="margin-top:18px" for="hzD">What did you see?</label>
    <textarea id="hzD" placeholder="Location in the end, extent, what changed"></textarea>

    <label class="f" for="hzA">Immediate action taken</label>
    <input type="text" id="hzA" placeholder="Barricaded, withdrew, made safe, none">

    <label class="f" for="hzN">Person or team notified</label>
    <input type="text" id="hzN" value="${esc(shift&&shift.accessBy||'')}" placeholder="Miner / Shift Boss name">

    <button class="btn danger" id="hzSave">Record hazard</button>
  </div>`;
  document.body.appendChild(d);

  let t='',s='';
  d.querySelectorAll('#hzT .chip').forEach(b=>b.onclick=()=>{
    d.querySelectorAll('#hzT .chip').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); t=b.dataset.v; });
  d.querySelectorAll('#hzS .chip').forEach(b=>b.onclick=()=>{
    d.querySelectorAll('#hzS .chip').forEach(x=>{x.classList.remove('sel');x.classList.remove('rust');});
    b.classList.add('sel'); if(b.dataset.v==='High') b.classList.add('rust'); s=b.dataset.v; });
  d.querySelector('#hzClose').onclick=()=>{ sosOpen=false; renderSOS(); };
  d.onclick=e=>{ if(e.target===d){ sosOpen=false; renderSOS(); } };
  d.querySelector('#hzSave').onclick=async()=>{
    if(!t||!s){ flash('Type and severity required',true); return; }
    await saveEntry('hazard',{hazardType:t, severity:s,
      description:d.querySelector('#hzD').value, action:d.querySelector('#hzA').value,
      notified:d.querySelector('#hzN').value, status:'Open'});
    sosOpen=false; renderSOS(); render();
    flash('Hazard recorded — now report it through the mine channel');
  };
}

    ['team','Team engagement','Workmates · PPE',true, shift.team.length||'—'],
    ['access','Workplace access','Permission · certification',unlocked('access'), g.access==='done'?'✓':'open'],
    ['facelog','Face log','Peg · advance · dimensions',unlocked('facelog'), g.counts.logs],
    ['bmsz','BMSZ marking','Visual · XRF · line',unlocked('bmsz'), g.counts.marks],
    ['offsets','Blast offsets','Over-break vs design cut',unlocked('offsets'), g.counts.offs],
    ['structure','Structures','Within 3 m of face',unlocked('structure'), cache.structure.filter(e=>e.shiftId===shift.id).length],
    ['hazard','Hazards','Observations',true, cache.hazard.length],
    ['reports','Shift report','Summary · sync',true, pending()],
    ['signout','Sign out','Close the shift',unlocked('signout'), g.out==='open'?'ready':'locked'],
  ];
  main.innerHTML=`
  <div class="eyebrow">${esc(session.role)} · ${esc(shift.shiftName)} shift</div>
  <h2 class="title">${esc(session.name.split('.').pop().trim())}</h2>
  <p class="sub">${place?`Working <b>${esc(place.bord)}</b>, ${esc(place.level)}, blast
    <b>${esc(place.blastNumber)}</b>. Cleared for re-entry by ${esc(place.clearedBy)}.`
    :'No workplace selected.'}</p>

  <div class="gates">
    <div class="gate ${g.pre}"><div class="gn">1 · Pre-shift</div>
      <div class="gs">${g.pre==='done'?'Complete':'Outstanding'}</div></div>
    <div class="gate ${g.access}"><div class="gn">2 · Access</div>
      <div class="gs">${g.access==='done'?'Certified':g.access==='open'?'Outstanding':'Locked'}</div></div>
    <div class="gate ${g.capture}"><div class="gn">3 · Capture</div>
      <div class="gs">${g.capture==='shut'?'Locked':g.capture==='done'?'Complete':'In progress'}</div></div>
    <div class="gate ${g.out==='open'?'open':'shut'}"><div class="gn">4 · Sign out</div>
      <div class="gs">${g.out==='open'?'Ready':'Locked'}</div></div>
  </div>

  ${g.pre!=='done'?`<div class="note warn"><span class="mk">◆</span><div>
    Pre-shift preparation is not complete. Face log, marking and offsets stay locked until the
    SHE record, tools inspection and underground register are done.</div></div>`:''}
  ${g.access!=='done'&&g.pre==='done'?`<div class="note warn"><span class="mk">◆</span><div>
    Workplace access has not been certified. Complete the access record at the end before
    logging anything.</div></div>`:''}

  <div class="mods">${mods.map(([v,n,d,ok,c])=>`
    <button class="mod ${ok?'':'locked'}" data-go="${v}">
      <div class="mi">${esc(d)}</div><div class="mn">${esc(n)}</div>
      <div class="mc">${ok?esc(String(c)):'🔒 locked'}</div></button>`).join('')}</div>`;

  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.go;
    if(!unlocked(v)){ flash('Complete the previous stage first',true); return; }
    setView(v);
  });
}

/* ═══ 21 · SHELL ══════════════════════════════════════════════════════ */

const NAV = [
  ['dash','Home'],['preshift','Pre-shift'],['team','Team'],['access','Access'],
  ['facelog','Face log'],['bmsz','BMSZ'],['offsets','Offsets'],['structure','Structures'],
  ['hazard','Hazards'],['note','Notes'],['reports','Report'],['signout','Sign out'],
];

function renderAppShell(app){
  const g=gates();
  app.innerHTML=`
  <div class="shell">
    <aside class="rail">
      <div class="railhead">
        <div class="mark">Unki <em>GeoTech</em></div>
        <div class="clause" style="margin-top:8px">${esc(session.name)}<br>${esc(session.role)}</div>
      </div>
      <div class="railnav">
        <div class="grp">Procedure</div>
        ${NAV.slice(0,8).map(([v,l])=>navBtn(v,l)).join('')}
        <div class="grp">Anytime</div>
        ${NAV.slice(8).map(([v,l])=>navBtn(v,l)).join('')}
      </div>
    </aside>
    <div class="body">
      <header class="top">
        <div class="toprow">
          <div class="mark" style="display:none" id="mMark">Unki <em>GeoTech</em></div>
          <div class="topmeta">
            <span class="netpill"><span class="netdot ${online()?'':'off'}"></span>
              ${online()?'Online':'Offline'} · ${pending()} held</span>
            <span id="clk"></span>
            <button class="btn ghost sm" id="chg">Change place</button>
          </div>
        </div>
        ${place?`<div class="wpbar">
          <span class="wpname">${esc(place.bord)}</span>
          <span class="wpsub">${esc(place.level)} · ${esc(place.section)} · blast ${esc(place.blastNumber)} ·
            ${esc(LIMITS[place.headingType].label)}</span>
          <span class="spacer"></span>
          <span class="wpsub">Face ${place.faceLength} × ${place.faceWidth} × ${place.faceHeight} m ·
            advance ${place.advance} m</span>
        </div>`:''}
      </header>
      <nav class="tabs">${NAV.map(([v,l])=>navBtn(v,l,true)).join('')}</nav>
      <main id="main"></main>
    </div>
  </div>
  <button class="sos" id="sos" aria-label="Record a hazard">
    <span class="g">⚠</span><span>SOS</span></button>`;

  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.nav;
    if(!unlocked(v)){ flash('Locked — complete the previous stage',true); return; }
    setView(v);
  });
  document.getElementById('sos').onclick=()=>{ sosOpen=true; renderSOS(); };
  document.getElementById('chg').onclick=()=>{ stage='reentry'; renderShell(); };
  clearInterval(window._clk); window._clk=setInterval(tick,20000); tick();
  render();
}
function navBtn(v,l,tab){
  const ok=unlocked(v);
  return `<button data-nav="${v}" class="${VIEW===v?'active':''} ${ok?'':'locked'}">
    ${ok?'':'<span class="lockglyph">🔒</span>'}${esc(l)}</button>`;
}
function tick(){
  const c=document.getElementById('clk');
  if(c) c.textContent=new Date().toLocaleString(undefined,
    {weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function setView(v){ VIEW=v; renderAppShell(document.getElementById('app')); window.scrollTo(0,0); }

function refreshNav(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    const v=b.dataset.nav, ok=unlocked(v);
    b.classList.toggle('locked',!ok);
    b.classList.toggle('active',VIEW===v);
    const g=b.querySelector('.lockglyph');
    if(ok&&g) g.remove();
    if(!ok&&!g) b.insertAdjacentHTML('afterbegin','<span class="lockglyph">\u{1F512}</span>');
  });
  const np=document.querySelector('.netpill');
  if(np) np.innerHTML='<span class="netdot '+(online()?'':'off')+'"></span>'+
    (online()?'Online':'Offline')+' \u00b7 '+pending()+' held';
}
function render(){
  const main=document.getElementById('main'); if(!main) return;
  const R={dash:renderDash, preshift:renderPreshift, team:renderTeam, access:renderAccess,
    facelog:renderFaceLog, bmsz:renderBmsz, offsets:renderOffsets, structure:renderStructure,
    hazard:renderHazardList, note:renderNote, reports:renderReports, signout:renderSignout};
  if(!unlocked(VIEW)) VIEW='dash';
  (R[VIEW]||renderDash)(main);
  refreshNav();
}
function renderShell(){
  const app=document.getElementById('app');
  clearInterval(window._clk);
  if(stage==='login')   return renderLogin(app);
  if(stage==='reentry') return renderReentry(app);
  renderAppShell(app);
}

/* ═══ 22 · BOOT ═══════════════════════════════════════════════════════ */

(async function boot(){
  window.addEventListener('online', ()=>{ if(stage==='app') renderAppShell(document.getElementById('app')); });
  window.addEventListener('offline',()=>{ if(stage==='app') renderAppShell(document.getElementById('app')); });

  session = await get('session');
  shift   = await get('shift:current');
  place   = await get('place');
  await loadAll();

  if(session && shift && place) stage='app';
  else if(session)              stage='reentry';
  else                          stage='login';

  if(stage==='reentry' && !reentryFeed.length){ /* board fetches on render */ }
  renderShell();
})();

</script>
</body>
</html>
