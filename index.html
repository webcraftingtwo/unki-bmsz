<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UNKI GEOTECH — Underground Field App</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   UNKI GEOTECH
   Built for ruggedised tablets underground. Design constraints:
   gloved hands, dust, cap-lamp light, water, time pressure.

   · Nothing below 13px. Body 17px. Data 20–34px.
   · Minimum tap target 60px. Primary actions 68px.
   · Palette taken from the job: BMSZ marking yellow is the
     primary action colour because it is the actual paint on
     the face. Rust = stop/breach. Green = in control.
   · Status is never colour alone — always colour + text.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --bg:#100E0A; --panel:#1A170F; --raised:#241F16; --sunk:#0A0906;
  --line:#3A3325; --line-soft:#2A2418;

  --paint:#FFC61A;        /* BMSZ marking yellow */
  --paint-dim:#5C4707;
  --rust:#E04A2F;         /* breach / stop / hazard */
  --rust-dim:#4A1C12;
  --grow:#5FB87A;         /* in control / cleared */
  --grow-dim:#16301F;
  --teal:#54A296;         /* informational / interpreted */
  --teal-dim:#14282B;

  --text:#F2ECDD; --dim:#B0A692; --faint:#756C58;

  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  /* Sized for gloved hands. NEVER reduce these — whitespace comes from
     margins around controls, never from shrinking the controls. */
  --tap:60px; --tap-lg:68px;
  --rail:236px;

  /* Spacing scale. One rhythm for the whole app so screens breathe
     consistently instead of each block inventing its own gap.
       s1 inside a control · s2 between fields · s3 inside a card
       s4 between cards    · s5 between sections of a screen */
  --s1:8px; --s2:14px; --s3:22px; --s4:30px; --s5:46px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--paint);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ── layout shell ─────────────────────────────────────────── */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.rail{display:none;}
.body{flex:1;min-width:0;display:flex;flex-direction:column;}

header.top{background:linear-gradient(180deg,var(--raised),var(--panel));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  padding:16px 22px;}
.toprow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.mark{font-weight:800;font-size:20px;letter-spacing:.06em;color:var(--paint);
  text-transform:uppercase;line-height:1;}
.mark em{font-style:normal;color:var(--dim);font-weight:500;}
.topmeta{display:flex;align-items:center;gap:14px;margin-left:auto;
  font-family:var(--mono);font-size:13px;color:var(--dim);flex-wrap:wrap;}
.netpill{display:flex;align-items:center;gap:7px;padding:6px 11px;
  border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-size:13px;}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--grow);flex:none;}
.netdot.off{background:var(--rust);}

.wpbar{margin-top:var(--s2);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--paint);
  border-radius:7px;padding:14px 18px;}
.wpbar .wpname{font-family:var(--mono);font-size:16px;color:var(--paint);font-weight:600;}
.wpbar .wpsub{font-family:var(--mono);font-size:13px;color:var(--faint);}
.wpbar .spacer{margin-left:auto;}

/* ── tabs (narrow) ────────────────────────────────────────── */
nav.tabs{display:flex;overflow-x:auto;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:29;
  scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:0 0 auto;background:none;border:none;color:var(--faint);
  font-family:var(--mono);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:0 16px;height:var(--tap);border-bottom:3px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:7px;}
nav.tabs button.active{color:var(--paint);border-bottom-color:var(--paint);background:var(--raised);}
/* Locked is never opacity alone — the glyph and the sunk ground say it too. */
nav.tabs button.locked{color:var(--faint);opacity:.5;background:var(--sunk);}
.lockglyph{font-size:12px;}

main{flex:1;padding:var(--s4) var(--s3) 140px;max-width:1180px;width:100%;margin:0 auto;}

/* ── wide screens: left rail ──────────────────────────────── */
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;width:var(--rail);flex:none;
    background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;}
  .railhead{padding:20px 18px 16px;border-bottom:1px solid var(--line);}
  .railnav{padding:10px 0;flex:1;}
  .railnav button{width:100%;background:none;border:none;text-align:left;
    color:var(--dim);font-family:var(--mono);font-size:14px;letter-spacing:.04em;
    text-transform:uppercase;padding:0 18px;height:var(--tap);
    display:flex;align-items:center;gap:11px;border-left:4px solid transparent;}
  .railnav button.active{color:var(--paint);border-left-color:var(--paint);background:var(--raised);}
  .railnav button.locked{opacity:.42;}
  .railnav .grp{font-family:var(--mono);font-size:12px;color:var(--faint);
    padding:16px 18px 7px;letter-spacing:.12em;text-transform:uppercase;}
  .railnav button.locked{opacity:.5;background:var(--sunk);}
  nav.tabs{display:none;}
  main{padding:var(--s5) 40px 150px;}
}

/* ── typography ───────────────────────────────────────────────
   The screen header is a block, not three stacked lines: eyebrow,
   title and subtitle sit tight together and then a full section gap
   separates them from the first card. */
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--teal);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:10px;}
h2.title{font-size:31px;margin:0 0 10px;font-weight:800;letter-spacing:-.015em;line-height:1.15;}
p.sub{color:var(--dim);font-size:16px;margin:0 0 var(--s5);max-width:66ch;line-height:1.6;}
/* A title with no subtitle still needs the gap under it. */
h2.title:last-child{margin-bottom:var(--s4);}
h3.sec{font-family:var(--mono);font-size:14px;color:var(--paint);text-transform:uppercase;
  letter-spacing:.1em;margin:0 0 var(--s3);font-weight:600;}
h3.sec + *{margin-top:0;}
.clause{font-family:var(--mono);font-size:12.5px;color:var(--faint);letter-spacing:.03em;}

/* ── cards & forms ────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:26px var(--s3);margin-bottom:var(--s4);}
.card.hot{border-color:var(--rust);}
.card.ok{border-color:var(--grow);}
.card.pri{border-color:var(--paint);}
/* A run of cards is a sequence of steps — give the eye the seam. */
.card + hr.div{margin-top:var(--s5);}
.grid{display:grid;gap:var(--s3);margin-bottom:var(--s3);}
.grid:last-child{margin-bottom:0;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media (min-width:701px) and (max-width:1000px){.g4{grid-template-columns:1fr 1fr;}}

label.f{display:block;font-size:14px;color:var(--dim);margin-bottom:10px;font-weight:500;
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
label.f b{color:var(--text);}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{
  width:100%;background:var(--sunk);border:1.5px solid var(--line);color:var(--text);
  padding:0 14px;height:var(--tap);border-radius:7px;font-size:17px;}
textarea{padding:13px 14px;height:auto;min-height:96px;resize:vertical;line-height:1.5;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--paint);background:#0D0B07;}
input.num,.mononum{font-family:var(--mono);font-variant-numeric:tabular-nums;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 20px) 26px,calc(100% - 14px) 26px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:44px;}

/* ── chips ────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:12px;}
/* min-height, not height: several call sites set height:auto inline so a
   long label can wrap. Without the floor those chips rendered at 42px —
   under the gloved-hand minimum. The floor holds whatever the call site
   does; wrapping chips grow past it instead of shrinking below it. */
.chip{border:1.5px solid var(--line);background:var(--sunk);color:var(--dim);
  font-size:15px;padding:0 18px;height:var(--tap);min-height:var(--tap);border-radius:8px;
  display:flex;align-items:center;user-select:none;}
.chip.sel{background:var(--paint-dim);border-color:var(--paint);color:var(--paint);font-weight:600;}
.chip.sel.rust{background:var(--rust-dim);border-color:var(--rust);color:#FFB9A8;}
.chip.sel.grow{background:var(--grow-dim);border-color:var(--grow);color:var(--grow);}

/* ── buttons ──────────────────────────────────────────────── */
/* One primary action per screen. The filled yellow button is it; ghost
   buttons recede so the eye does not have to choose between two equals. */
.btn{width:100%;height:var(--tap-lg);border-radius:9px;border:1.5px solid var(--paint);
  background:var(--paint);color:#161200;font-family:var(--mono);font-weight:700;
  font-size:15px;letter-spacing:.07em;text-transform:uppercase;margin-top:var(--s3);
  display:flex;align-items:center;justify-content:center;gap:9px;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.35;pointer-events:none;}
.btn.ghost{background:none;color:var(--faint);border-color:var(--line-soft);font-weight:600;}
.btn.danger{background:var(--rust);border-color:var(--rust);color:#fff;}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#08201D;}
.btn.sm{height:var(--tap);font-size:14px;width:auto;padding:0 20px;margin-top:0;}
/* A secondary action never sits flush against the primary one. */
.btn + .btn{margin-top:var(--s2);}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3);}
.btnrow .btn{width:auto;flex:1;min-width:180px;margin-top:0;}
.btnrow .btn + .btn{margin-top:0;}

/* ── checklist ────────────────────────────────────────────── */
.check{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;
  border:1.5px solid var(--line);border-radius:9px;margin-bottom:var(--s2);background:var(--sunk);
  min-height:var(--tap);}
.check:last-of-type{margin-bottom:0;}
.check.on{border-color:var(--grow);background:var(--grow-dim);}
.check.fail{border-color:var(--rust);background:var(--rust-dim);}
.check .box{width:30px;height:30px;border:2px solid var(--line);border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
  color:transparent;margin-top:1px;}
.check.on .box{border-color:var(--grow);background:var(--grow);color:#08200F;}
.check.fail .box{border-color:var(--rust);background:var(--rust);color:#fff;}
.check .txt{flex:1;font-size:16px;line-height:1.5;}
/* Clause citations. Traceability, not decoration — keep them legible. */
.check .txt small{display:block;color:var(--faint);font-size:13px;margin-top:7px;
  font-family:var(--mono);line-height:1.5;}
.check .flag{background:none;border:1.5px solid var(--line);color:var(--faint);
  border-radius:7px;height:42px;padding:0 13px;font-family:var(--mono);font-size:12.5px;
  text-transform:uppercase;flex:none;}
.check.fail .flag{border-color:var(--rust);color:#FFB9A8;}

/* ── notices ──────────────────────────────────────────────── */
.note{border-radius:9px;padding:19px var(--s3);font-size:15.5px;line-height:1.6;
  margin-bottom:var(--s4);display:flex;gap:16px;align-items:flex-start;}
.note .mk{font-family:var(--mono);font-size:20px;line-height:1.1;flex:none;font-weight:700;}
.note.stop{border:1.5px solid var(--rust);background:var(--rust-dim);color:#FFC9BC;}
.note.stop .mk{color:var(--rust);}
.note.info{border:1.5px solid var(--teal);background:var(--teal-dim);color:#B4DDD6;}
.note.info .mk{color:var(--teal);}
.note.go{border:1.5px solid var(--grow);background:var(--grow-dim);color:#B9E5C6;}
.note.go .mk{color:var(--grow);}
.note.warn{border:1.5px solid var(--paint);background:#33280A;color:#FFE0A0;}
.note.warn .mk{color:var(--paint);}
.note b{color:#fff;}

/* ── data display ─────────────────────────────────────────── */
/* Values the technician reads back off the screen. Bigger than the
   prose around them, because that is what they are looking for. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:var(--s2);
  margin-bottom:var(--s4);}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:20px 18px;}
.stat.hot{border-color:var(--rust);}
.stat .num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--paint);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.stat.hot .num{color:var(--rust);}
.stat .lbl{font-family:var(--mono);font-size:12.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin-top:10px;line-height:1.45;}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin-bottom:var(--s4);}
table{width:100%;border-collapse:collapse;font-size:15.5px;}
th{background:var(--raised);font-family:var(--mono);font-size:12.5px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:16px;font-weight:600;
  white-space:nowrap;}
td{padding:16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;}
tr.breach td{background:#2A130E;}
td.n{font-family:var(--mono);}

.item{border:1.5px solid var(--line);border-radius:9px;padding:20px;margin-bottom:var(--s2);
  background:var(--panel);}
.item.hot{border-color:var(--rust);}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
  margin-bottom:12px;flex-wrap:wrap;}
.item .it{font-family:var(--mono);font-size:17px;color:var(--paint);font-weight:600;}
.item .ts{font-family:var(--mono);font-size:13px;color:var(--faint);}
.item .ib{font-size:15px;color:var(--dim);line-height:1.7;}
.item .ib b{color:var(--text);}

.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:5px;font-weight:600;}
.tag.pend{background:#33280A;color:var(--paint);border:1px solid var(--paint-dim);}
.tag.sync{background:var(--grow-dim);color:var(--grow);border:1px solid var(--grow);}
.tag.stop{background:var(--rust-dim);color:#FFB9A8;border:1px solid var(--rust);}
.tag.info{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal);}

.empty{text-align:center;padding:56px var(--s3);color:var(--faint);font-size:16px;
  font-family:var(--mono);border:1.5px dashed var(--line);border-radius:10px;}

/* ── module grid ──────────────────────────────────────────── */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3);}
.mod{background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:var(--s3);
  text-align:left;color:var(--text);min-height:152px;display:flex;flex-direction:column;}
.mod:active{background:var(--raised);}
/* Locked reads as locked without relying on dimming alone: dashed edge,
   sunk ground, and the word "locked" in place of the count. */
.mod.locked{opacity:.55;border-style:dashed;background:var(--sunk);}
.mod .mi{font-family:var(--mono);font-size:12.5px;color:var(--teal);text-transform:uppercase;
  letter-spacing:.08em;line-height:1.45;}
.mod .mn{font-size:20px;font-weight:700;margin-top:12px;line-height:1.3;}
.mod .mc{font-family:var(--mono);font-size:28px;color:var(--paint);margin-top:auto;
  padding-top:var(--s3);font-variant-numeric:tabular-nums;}
.mod.locked .mc{color:var(--faint);font-size:14px;}

/* ── gate strip ───────────────────────────────────────────── */
.gates{display:flex;gap:0;margin-bottom:var(--s4);border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--panel);flex-wrap:wrap;}
.gate{flex:1;min-width:140px;padding:18px;border-right:1px solid var(--line);}
.gate:last-child{border-right:none;}
.gate .gn{font-family:var(--mono);font-size:12px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;line-height:1.45;}
.gate .gs{font-family:var(--mono);font-size:15px;margin-top:9px;font-weight:600;}
.gate.done .gs{color:var(--grow);}
.gate.open .gs{color:var(--paint);}
.gate.shut .gs{color:var(--faint);}

/* ── flash toast ──────────────────────────────────────────── */
.flash{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--grow);
  color:#08200F;font-family:var(--mono);font-size:15px;font-weight:700;padding:14px 26px;
  border-radius:9px;z-index:90;opacity:0;transition:opacity .22s;pointer-events:none;
  box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
.flash.show{opacity:1;}
.flash.bad{background:var(--rust);color:#fff;}


/* ── full screen stages ───────────────────────────────────── */
.stage{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:var(--s5) var(--s3) var(--s5);
  background:radial-gradient(ellipse at 50% 0%,#231E14,#0B0A06);}
.stagebox{width:100%;max-width:600px;margin:0 auto;}
.brandbig{text-align:center;margin-bottom:var(--s5);}
.brandbig .b1{font-size:36px;font-weight:800;color:var(--paint);letter-spacing:.07em;
  text-transform:uppercase;line-height:1;}
.brandbig .b2{font-family:var(--mono);font-size:14px;color:var(--faint);letter-spacing:.14em;
  margin-top:14px;text-transform:uppercase;line-height:1.6;}

/* ── re-entry board ───────────────────────────────────────── */
.rec{border:1.5px solid var(--line);border-left:5px solid var(--faint);border-radius:9px;
  padding:var(--s3);margin-bottom:var(--s2);background:var(--panel);width:100%;
  text-align:left;color:var(--text);}
.rec.cleared{border-left-color:var(--grow);}
.rec.held{border-left-color:var(--rust);}
.rec.pending{border-left-color:var(--paint);}
.rec.sel{border-color:var(--paint);background:var(--raised);}
.rec .rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.rec .rn{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--paint);}
.rec .rm{font-family:var(--mono);font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.7;}
.rec .rm b{color:var(--text);}
.taskchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.tchip{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  padding:5px 10px;border-radius:5px;background:var(--teal-dim);color:var(--teal);
  border:1px solid var(--teal);font-weight:600;}
.tchip.mk{background:var(--paint-dim);color:var(--paint);border-color:var(--paint);}

/* ── section view ─────────────────────────────────────────── */
.svgbox{background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  padding:18px 10px 8px;margin-bottom:var(--s4);}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center;
  font-family:var(--mono);font-size:12.5px;color:var(--faint);padding:12px 4px 2px;}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;}

/* ── offsets screen: reach beats air ──────────────────────────
   Everything above the entry pad pushes it further from the thumb.
   This screen is worked standing at a face with a tape in one hand,
   so it keeps the compact rhythm while the rest of the app breathes.
   Tap targets are untouched — only the gaps between them. */
.view-offsets header.top{padding:12px 18px;}
.view-offsets .wpbar{margin-top:11px;padding:11px 14px;}
.view-offsets main{padding-top:20px;}
.view-offsets .eyebrow{margin-bottom:6px;}
.view-offsets h2.title{font-size:27px;margin-bottom:6px;}
.view-offsets p.sub{margin-bottom:var(--s3);}
.view-offsets .card{padding:20px;margin-bottom:18px;}
.view-offsets h3.sec{margin-bottom:14px;}
.view-offsets .grid{gap:var(--s2);margin-bottom:var(--s2);}
.view-offsets label.f{margin-bottom:7px;}
.view-offsets .check{padding:15px 16px;margin-bottom:10px;}
.view-offsets .check .txt small{margin-top:4px;}
.view-offsets .hint{margin-top:9px;}

.view-offsets .note{margin-bottom:18px;}

/* ── keypad ───────────────────────────────────────────────────
   Used standing at a face. Held deliberately tight: extra air here
   pushes the pad below the fold on a tablet in portrait, and the
   technician is reaching for it with a glove on, not reading it. */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pad button{height:var(--tap-lg);border-radius:9px;background:var(--raised);
  border:1.5px solid var(--line);color:var(--text);font-family:var(--mono);
  font-size:23px;font-weight:600;}
.pad button:active{background:var(--paint-dim);}
.pad button.act{background:var(--paint);color:#161200;border-color:var(--paint);
  font-size:14px;letter-spacing:.06em;font-weight:800;}
.pad button.sm{font-size:14px;letter-spacing:.05em;color:var(--dim);}

.field{width:100%;text-align:left;border-radius:9px;padding:14px 16px;background:var(--sunk);
  border:2px solid var(--line);color:var(--text);margin-bottom:11px;}
.field.act{border-color:var(--paint);background:var(--raised);}
.field.bad{border-color:var(--rust);}
.field .fl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;
  color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}
.field .fv{font-family:var(--mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.05;}
.field .fs{font-family:var(--mono);font-size:13.5px;font-weight:700;margin-top:6px;
  letter-spacing:.04em;}

hr.div{border:none;border-top:1px solid var(--line);margin:var(--s5) 0 var(--s4);}

/* ── face photo mark-up ───────────────────────────────────── */
input[type=file]{width:100%;background:var(--sunk);border:1.5px solid var(--line);
  color:var(--text);border-radius:7px;padding:16px;min-height:var(--tap);font-size:15px;}
input[type=file]::file-selector-button{background:var(--raised);border:1.5px solid var(--line);
  color:var(--text);border-radius:6px;padding:11px 16px;margin-right:14px;
  font-family:var(--mono);font-size:14px;}
.photowrap{border:1.5px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--sunk);line-height:0;}
.photowrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;}
.facephoto{display:block;width:100%;height:auto;margin-top:var(--s2);
  border:1px solid var(--line);border-radius:8px;}
.hint{font-size:14px;color:var(--faint);line-height:1.65;margin-top:var(--s2);}
.card > .hint:last-child{margin-bottom:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>

<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   UNKI GEOTECH · underground geological field application
   Governing standard: UNKI-MIN-MRM-STD-201 v2.0 "BMSZ Marking & Face
   Measurements", 20/05/2011. Referenced procedure UNKI-MIN-MRM-PRO-200.

   Every checklist item below carries the clause it enforces. Nothing in
   this file is invented policy — where the standard is silent the item is
   marked DERIVED so the Chief Geologist can rule on it.

   NOT AN OFFICIAL UNKI SYSTEM until formally authorised (§39 of brief).
   ═══════════════════════════════════════════════════════════════════════ */

const PFX = 'unkigeo';
/* REWORK 2 removed the BMSZ marking screen and the notes / log book, so
   neither kind is written any more. */
const KINDS = ['faceLog','offsetSet','structure','shift'];
let cache = {}; KINDS.forEach(k=>cache[k]=[]);

let stage   = 'login';     // login → reentry → app → signout
let VIEW    = 'dash';
let session = null;        // {name, role, employeeNo, section}
let place   = null;        // selected workplace, hydrated from re-entry feed
let shift   = null;        // active shift record with all gate states

/* ═══ 1 · PEOPLE ══════════════════════════════════════════════════════

   There is no hardcoded user list any more. People create accounts and
   sign in — see §7. What stays here is the role model: what a role is
   allowed to do, which is a statement about the standard, not about any
   particular person.

   This table is NOT the enforcement boundary. RLS on the shared project
   is. Never grant a read here that RLS would refuse.                  */

const CAN = {
  'Geological Technician':{capture:true, authoriseDeviation:false, review:false},
  'Section Geologist':    {capture:true, authoriseDeviation:false, review:true},
  'Chief Geologist':      {capture:true, authoriseDeviation:true,  review:true},
  'MRM Manager':          {capture:false,authoriseDeviation:false, review:true},
};
const can = k => session ? !!(CAN[session.role]||{})[k] : false;

/* ═══ 2 · REFERENCE DATA ══════════════════════════════════

   REWORK, Chief Geologist meeting notes — deviation authorised under
   §7.3. The PPE, tools, transport, underground register and XRF
   pre-inspection lists were removed on the grounds that they duplicate
   controls the mine already runs elsewhere. The geological hazard form
   went with them.

   ONE safety control was kept, and it blocks: the miner's declaration
   that the area was made safe. REWORK 2 moved it onto its own
   acknowledgement screen, ahead of the face log.

   REWORK 2 — second round of handwritten notes, same §7.3 authorisation
   chain, confirmed by the technician's superiors:
     · "End is cleaned to the footwall" removed from readiness. The
       standard's wording at §9.2 is "No end will be marked unless it is
       cleaned to the footwall", so that clause is no longer enforced by
       this app. Recorded, not hidden.
     · S/B and O/I Miner added to the team on face.
   ════════════════════════════════════════════════════════════════════ */

/* §9.2 — hard gate, minus the footwall-cleaned item (see above). */
const READINESS = [
  ['End is supported',                    '§9.2'],
  ['End is lashed to the footwall',       '§9.2'],
];

/* TARP — Trigger Action Response Plan class. REWORK: added to the face
   log. DERIVED: the notes give the four values but not their meaning,
   so no behaviour is attached to the choice. */
const TARP = ['1','2','3','S'];

/* REWORK: the face log now records who was on the face. */
/* REWORK 2: the face team now names the Shift Boss and the O/I Miner. */
const TEAM_ROLES = ['Section manager','Geologist','Shaft geologist','Official',
                    'Shift Boss (S/B)','O/I Miner'];

/* §9.3 — structures that may affect reef/BMSZ. */
const STRUCTURES = [
  {t:'Xenolith',   n:'Fragment of older lithology within younger rock. Not mineralised at Unki — lash mined material to waste.'},
  {t:'Autolith',   n:'Inclusion genetically related to the host igneous rock.'},
  {t:'Fault',      n:'Fracture with observable displacement. Common in the Great Dyke; oblique to layering, or parallel (thrust).'},
  {t:'Shear',      n:'Deformation without displacement. Less common than faulting, seldom seen in Great Dyke successions.'},
  {t:'Dyke',       n:'Sheet-like intrusive body. Dolerite or granite/aplite. Dolerite preferred to "diabase". Often associated with faults; groundwater repository or barrier.'},
  {t:'Sill',       n:'Sheet-like intrusive, concordant. Not common at Unki.'},
  {t:'Vein',       n:'Late fluid-derived. Felsic pegmatite, carbonate, quartz.'},
  {t:'Replacement pegmatite', n:'Coarse grained pyroxenite replacing reef. PGE barren at Unki. Highly irregular, undulatory contacts, rapidly changing shape.'},
  {t:'Joint',      n:'All joints within 3 m of face must be noted. §9.6.3'},
];

/* ═══ 3 · UNITS AND LIMIT SETS ═══════════════════════════════

   REWORK §1: every offset is stored in CENTIMETRES — what the
   technician reads off the tape. A reading converted on entry is a
   reading that can be converted wrongly, and once stored there is
   nothing left to check it against.

   Metres appear at exactly two places, both of them figures leaving
   geology for management: the width-control report and the management
   screen. Both go through toM(). Nowhere else in this file converts.
   ════════════════════════════════════════════════════════════════════ */

/* cm → m, for management figures only. */
const toM = cm => cm==null ? null : cm/100;

/* Limit sets are versioned data, never constants to edit in place.
   Changing one requires Chief Geologist authorisation (§7.3) and an
   audit row. The applied set is snapshotted onto every record it
   judged, so a limit revised next year does not silently restate what
   an old face was measured against. */
const LIMIT_SET = {
  version: '2026-09-CG-REWORK',
  basis:   'Chief Geologist meeting notes; sheets 2NB3 12-07-10, MM 26-04-10, NS3 12-07-10',
};
const LIMITS = {
  bord:    {label:'Bord / ledging decline', hw:45,  fw:-135, src:'Sheet 2NB3 12-07-10'},
  decline: {label:'Decline / strike drive', hw:150, fw:-100, src:'Sheets MM 26-04-10, NS3 12-07-10'},
};

/* REWORK §3: a face with any station mined above this is flagged at
   save, not recomputed per report, and the management screen opens on
   flagged faces first. */
const HEIGHT_FLAG_CM = 200;

/* REWORK §2: the traverse is applied, not offered. Stations at 1 m,
   the first 1 m off the sidewall, no station zero, count = face length
   − 1. This overrides §9.8.iv's two-metre interval, which the mine does
   not work to. It is applied because a face measured at a different
   spacing cannot be set beside the others, and comparison across faces
   is the only reason these readings are collected. The interval is
   still written onto every record, so an old reading stays readable at
   the spacing it was taken at. */
const STATION_INTERVAL_M = 1;

/* REWORK 2 — TWO ROUNDS, NOT TWO STATIONS.
   The earlier build read "the 2 m and 5 m offsets" as two mandatory
   stations inside one traverse. The handwritten notes settle it: it is
   "record first round of offsets at 2 m distance, repeat the same
   recordings at 5 m distance" — two complete traverses of the same
   stations, taken at two standing distances from the face. Open
   decision 13 is closed by this.

   §9.8 has readings taken 1 m from the face; 2 m and 5 m replace that,
   under the same §7.3 authorisation as the rest of REWORK 2. */
const ROUNDS = [
  {key:'r2', dist:2, label:'Round 1 · 2 m from face'},
  {key:'r5', dist:5, label:'Round 2 · 5 m from face'},
];

/* Station i (0-based) sits at (i+1) metres. There is no station zero. */
const stationDist = i => (i+1)*STATION_INTERVAL_M;
const stationCount = faceLength => Math.max(1, Math.floor(faceLength/STATION_INTERVAL_M) - 1);

/* Blast-induced offset causes. The offset module records deviation of the
   blasted profile from the design cut — over-break and under-break caused
   by the blast, not by geology. Geological displacement is recorded
   separately under Structures. */
const BLAST_CAUSES = [
  'Over-charging / excess explosive',
  'Hole deviation — drilling alignment',
  'Rig not aligned to BMSZ sidewall mark',
  'Incorrect burden or spacing',
  'Sockets / misfire redrill',
  'Poor ground conditions',
  'Support installation requirement',
  'Marking not followed by crew',
  'Other — see notes',
];

/* ═══ 4 · RE-ENTRY INTEGRATION ════════════════════════════════════════

   ┌───────────────────────────────────────────────────────────────────┐
   │  INTERFACE CONTRACT — Re-entry App → GeoTech App                  │
   │                                                                   │
   │  Replace fetchReentryFeed() with a call to the Re-entry App API.  │
   │  Nothing else in this file needs to change. Expected shape:       │
   │                                                                   │
   │  { id, level, section, bord, headingType,                         │
   │    blastNumber, blastAt, advance,                                 │
   │    reentry: { status:'cleared'|'held'|'pending',                  │
   │               clearedBy, clearedAt, gas:{ch4,co}, note },         │
   │    minerTask: { tasks:['drilling','face_marking'],                │
   │                 selectedBy, selectedAt },                         │
   │    face: { length, width, height },                               │
   │    peg, pegDistance }                                             │
   │                                                                   │
   │  Rules enforced downstream:                                       │
   │   · status must be 'cleared' before the workplace can be opened   │
   │   · 'face_marking' in minerTask auto-queues it for this Geo-Tech  │
   │   · blast number, advance, peg and face dimensions pre-populate   │
   │     the face log — the technician never retypes them              │
   └───────────────────────────────────────────────────────────────────┘ */

const MOCK_REENTRY = [
  { id:'RE-2026-0912-01', level:'2 Level', section:'North', bord:'2NB3', headingType:'bord',
    blastNumber:'14', blastAt:'2026-09-12T22:40:00', advance:2.4,
    reentry:{status:'cleared', clearedBy:'M. Sibanda (Shift Boss)', clearedAt:'2026-09-13T04:15:00',
             gas:{ch4:0.0, co:3}, note:'Ventilation restored, face washed down.'},
    minerTask:{tasks:['drilling','face_marking'], selectedBy:'P. Ncube (Miner)', selectedAt:'2026-09-13T04:40:00'},
    face:{length:11.4, width:11.4, height:2.6}, peg:'1255', pegDistance:19.3 },

  { id:'RE-2026-0912-02', level:'3 Level', section:'North', bord:'NS3', headingType:'decline',
    blastNumber:'09', blastAt:'2026-09-12T23:05:00', advance:2.1,
    reentry:{status:'cleared', clearedBy:'M. Sibanda (Shift Boss)', clearedAt:'2026-09-13T04:22:00',
             gas:{ch4:0.0, co:2}, note:'Cleared. Loose barred in sidewall.'},
    minerTask:{tasks:['face_marking'], selectedBy:'P. Ncube (Miner)', selectedAt:'2026-09-13T04:41:00'},
    face:{length:7.2, width:7.2, height:2.8}, peg:'1301', pegDistance:5.1 },

  { id:'RE-2026-0912-03', level:'2 Level', section:'South', bord:'2SB1', headingType:'bord',
    blastNumber:'21', blastAt:'2026-09-12T22:55:00', advance:2.2,
    reentry:{status:'held', clearedBy:null, clearedAt:null, gas:{ch4:0.6, co:41},
             note:'HELD — fumes not cleared, CO above re-entry limit. Re-test scheduled.'},
    minerTask:{tasks:[], selectedBy:null, selectedAt:null},
    face:{length:10.8, width:10.8, height:2.6}, peg:'1188', pegDistance:22.7 },

  { id:'RE-2026-0912-04', level:'3 Level', section:'South', bord:'3SB2', headingType:'bord',
    blastNumber:'07', blastAt:'2026-09-12T23:20:00', advance:2.5,
    reentry:{status:'pending', clearedBy:null, clearedAt:null, gas:null,
             note:'Awaiting examination.'},
    minerTask:{tasks:[], selectedBy:null, selectedAt:null},
    face:{length:11.0, width:11.0, height:2.7}, peg:'1342', pegDistance:14.2 },
];

let reentryFeed = [];
let feedFetchedAt = null;

async function fetchReentryFeed(){
  /* ── SWAP THIS FOR THE REAL RE-ENTRY APP CALL ──
     const r = await fetch(REENTRY_API + '/cleared?shift=' + shiftCode());
     return await r.json();                                              */
  await new Promise(r=>setTimeout(r,420));
  return JSON.parse(JSON.stringify(MOCK_REENTRY));
}

/* Workplaces the miner has flagged for face marking AND re-entry has cleared. */
function assignedToMe(){
  return reentryFeed.filter(r =>
    r.reentry.status==='cleared' && (r.minerTask.tasks||[]).includes('face_marking'));
}
function canOpen(r){ return r.reentry.status==='cleared'; }

/* ═══ 5 · STORAGE ═════════════════════════════════════════════════════ */

function nowTS(){ return new Date().toISOString(); }
function fmtTS(iso){ if(!iso) return '—'; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'})+' '+
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtT(iso){ if(!iso) return '—'; return new Date(iso)
  .toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── UI copy switch ───────────────────────────────────────────────────
   Background copy — why the app or the standard works a certain way —
   is hidden for now. Nothing is deleted: flip SHOW_HELP to true to
   bring every block back at once.

   Only background copy goes through help(). Anything that tells the
   technician what to DO, or states a requirement, is NEVER wrapped and
   always shows: the R4 continuous-marking block and the marking
   instruction (§9.6.3, §9.7), safety stop notes (§9.5), the
   second-opinion accountability note (§9.1), the 3 m structures
   requirement (§9.3), over-break breach warnings, gate-lock warnings,
   keypad instructions and clause citations on checklist items. */
const SHOW_HELP = false;
const help = html => SHOW_HELP ? html : '';
function flash(msg,bad){ const f=document.getElementById('flash'); if(!f)return;
  f.textContent=msg; f.className='flash show'+(bad?' bad':'');
  clearTimeout(f._t); f._t=setTimeout(()=>f.className='flash'+(bad?' bad':''),1800); }
function num(v){ if(v===''||v==null||v==='-') return null; const n=parseFloat(v);
  return isNaN(n)?null:n; }

const HAS_STORE = (typeof window!=='undefined' && window.storage &&
                  typeof window.storage.set==='function');
const memStore = {};
async function put(key,val){
  if(!HAS_STORE){ memStore[key]=JSON.stringify(val); return true; }
  try{ await window.storage.set(PFX+':'+key, JSON.stringify(val), false); return true; }
  catch(e){ console.error('store',e); return false; }
}
async function get(key){
  if(!HAS_STORE){ const v=memStore[key]; return v?JSON.parse(v):null; }
  try{ const r=await window.storage.get(PFX+':'+key,false);
       return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
}
async function saveEntry(kind,data){
  const e = { id:uid(), ts:nowTS(), by:session?session.name:'unknown',
              byNo:session?session.employeeNo:'', shiftId:shift?shift.id:null,
              place: place?{level:place.level,section:place.section,bord:place.bord,
                            blastNumber:place.blastNumber}:null,
              synced:false, ...data };
  const ok = await put(kind+':'+e.id, e);
  cache[kind].unshift(e);
  flash(ok?'Saved locally':'Saved to memory — storage unavailable', !ok);
  return e;
}
async function updateEntry(kind,e){ await put(kind+':'+e.id, e); }

async function loadAll(){
  if(!HAS_STORE) return;
  for(const k of KINDS){
    try{
      const list = await window.storage.list(PFX+':'+k+':', false);
      const out=[];
      if(list&&list.keys) for(const key of list.keys){
        try{ const r=await window.storage.get(key,false); if(r&&r.value) out.push(JSON.parse(r.value)); }catch(e){}
      }
      out.sort((a,b)=> new Date(b.ts)-new Date(a.ts));
      cache[k]=out;
    }catch(e){ cache[k]=[]; }
  }
}
const online = ()=> navigator.onLine;
function pending(){ let n=0; KINDS.forEach(k=>cache[k].forEach(e=>{ if(!e.synced) n++; })); return n; }

async function syncNow(){
  if(!online()){ flash('Offline — '+pending()+' record(s) held on device',true); return; }
  let n=0;
  for(const k of KINDS) for(const e of cache[k])
    if(!e.synced){ e.synced=true; e.syncedAt=nowTS(); await updateEntry(k,e); n++; }
  flash(n? 'Synced '+n+' record(s) to MRM' : 'Already up to date');
  render();
}
/* ═══ 6 · SHIFT & GATE MODEL ══════════════════════
   Still a locked chain. REWORK 2 splits the old face log in two, per the
   screen order in the design notes:

     Sign in → Acknowledgement → Face log → Offsets / Structures → Out

   THE GATE is on the acknowledgement screen: it cannot be submitted with
   the area declared not made safe, or with no miner named. Until it is,
   the face log is unreachable; until a face log exists, offsets and
   structures are unreachable. If any of those becomes reachable out of
   order, that is a bug, not a shortcut.

   The BMSZ marking screen was removed on instruction (REWORK 2, note 4).
   Rule R4 — §9.7's block on marking a continuous line where channel
   samples were requested — lived on that screen and is therefore no
   longer enforced anywhere in this app. Nothing else here can enforce
   it, because nothing else records a marking decision. */

function newShift(){
  return {
    id:uid(), date:new Date().toISOString().slice(0,10), startedAt:nowTS(), endedAt:null,
    shiftName:'Morning',
    placeId:null,
    ack:null,             // REWORK 2 — the acknowledgement gate, once passed
    signout:{}, deviation:null,
  };
}

function gates(){
  const s = shift;
  if(!s) return {ack:'open',log:'shut',capture:'shut',out:'shut',
                 counts:{logs:0,offs:0,structs:0}};
  const logs = cache.faceLog.filter(e=>e.shiftId===s.id).length;
  const offs = cache.offsetSet.filter(e=>e.shiftId===s.id).length;
  const structs = cache.structure.filter(e=>e.shiftId===s.id).length;
  const acked = !!(s.ack && s.ack.areaSafe===true && s.ack.miner);
  return {
    ack:     acked?'done':'open',
    log:     acked?(logs?'done':'open'):'shut',
    capture: logs?(offs?'done':'open'):'shut',
    out:     (acked&&logs&&offs)?'open':'shut',
    counts:{logs,offs,structs},
  };
}
const unlocked = v => {
  const g = gates();
  if(['dash','ack','reports'].includes(v)) return true;
  if(v==='facelog') return g.ack==='done';
  if(['offsets','structure'].includes(v)) return g.log==='done';
  if(v==='signout') return g.out==='open';
  return true;
};

/* ═══ 7 · ACCOUNTS AND AUTHENTICATION ═════════════════════════════════

   Replaces the pick-a-name-and-type-any-PIN prototype login. Every
   record carries the observer who made it and cannot be edited
   afterwards (§9.1), so who is signed in has to mean something.

   Passwords are never stored. Each account keeps a random per-account
   salt and a PBKDF2-SHA-256 derivation of the password, and sign-in
   re-derives and compares in constant time.

   IF crypto.subtle IS MISSING, AUTHENTICATION FAILS CLOSED. There is no
   weaker fallback path — a hash that is cheap to reverse is worse than
   an app that will not sign you in, because the second one you notice.

   ── WHERE SUPABASE GOES ────────────────────────────────────────────
   The mine's accounts belong in the shared Supabase project with the
   roles from the RLS migration, exactly as CLAUDE.md says. Nothing in
   this repo has credentials for it, so accounts live in the device
   store for now. Four functions are the whole seam — replace their
   bodies with supabase.auth calls and nothing else in this file moves:

     findAccount()    → auth.admin / a profiles read
     createAccount()  → auth.signUp
     authenticate()   → auth.signInWithPassword
     newSession()     → the session auth returns

   Until that happens: accounts are per-device, they do not sync, and
   they are NOT the enforcement boundary. RLS is. Never treat a signed-in
   role in this file as permission to read another section's data.
   ═══════════════════════════════════════════════════════════════════ */

const AUTH = {
  ALGO:       'PBKDF2-SHA256',
  ITERATIONS: 210000,   // OWASP floor for PBKDF2-HMAC-SHA256
  SALT_BYTES: 16,
  KEY_BITS:   256,
  MIN_PW:     10,
  MAX_TRIES:  5,
  LOCKOUT_MS: 15*60*1000,
  SESSION_MS: 12*60*60*1000,   // one shift; re-authenticate after
};

/* Sections are exactly these — same as SLAM. Never invent another. */
const SECTIONS = ['14 South','16 North'];
const ROLES = Object.keys(CAN);

const cryptoOK = () => !!(window.crypto && window.crypto.subtle &&
                          typeof window.crypto.subtle.deriveBits==='function' &&
                          window.crypto.getRandomValues);

const b64   = bytes => btoa(String.fromCharCode.apply(null, Array.from(bytes)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const normNo = s => String(s||'').trim().toUpperCase();

async function derive(password, salt, iterations){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, AUTH.KEY_BITS);
  return new Uint8Array(bits);
}

/* Constant time. Never leak how much of a hash matched. */
function sameBytes(a,b){
  if(a.length!==b.length) return false;
  let diff=0;
  for(let i=0;i<a.length;i++) diff |= a[i]^b[i];
  return diff===0;
}

/* ── the Supabase seam ───────────────────────────────────────────── */

async function accountIndex(){ return (await get('accounts:index')) || []; }

async function findAccount(employeeNo){
  const no = normNo(employeeNo);
  if(!no) return null;
  return await get('account:'+no);
}

async function createAccount({name, employeeNo, role, section, password}){
  if(!cryptoOK()) throw new Error('This browser cannot hash passwords securely.');
  const no = normNo(employeeNo);
  if(await findAccount(no)) throw new Error('That employee number already has an account.');
  const salt = crypto.getRandomValues(new Uint8Array(AUTH.SALT_BYTES));
  const hash = await derive(password, salt, AUTH.ITERATIONS);
  const acct = {
    employeeNo:no, name:name.trim(), role, section,
    algo:AUTH.ALGO, iterations:AUTH.ITERATIONS,
    salt:b64(salt), hash:b64(hash),
    /* Role is self-declared on this form. In production it comes from
       the RLS migration, not from whoever filled the form in. Recorded
       so a reviewer can tell the two apart. */
    roleSource:'self-declared',
    createdAt:nowTS(), failed:0, lockedUntil:null,
  };
  await put('account:'+no, acct);
  const idx = await accountIndex();
  if(!idx.includes(no)) await put('accounts:index', idx.concat([no]));
  return acct;
}

/* Returns {ok, account} or {ok:false, reason}. The caller shows one
   message for "no such account" and "wrong password" alike — telling
   the two apart just enumerates who works here. */
async function authenticate(employeeNo, password){
  if(!cryptoOK()) return {ok:false, reason:'nocrypto'};
  const acct = await findAccount(employeeNo);
  if(!acct) return {ok:false, reason:'bad'};
  if(acct.lockedUntil && new Date(acct.lockedUntil) > new Date())
    return {ok:false, reason:'locked', until:acct.lockedUntil};

  const hash = await derive(password, unb64(acct.salt), acct.iterations);
  if(!sameBytes(hash, unb64(acct.hash))){
    acct.failed = (acct.failed||0)+1;
    if(acct.failed >= AUTH.MAX_TRIES){
      acct.lockedUntil = new Date(Date.now()+AUTH.LOCKOUT_MS).toISOString();
      acct.failed = 0;
      await put('account:'+acct.employeeNo, acct);
      return {ok:false, reason:'locked', until:acct.lockedUntil};
    }
    await put('account:'+acct.employeeNo, acct);
    return {ok:false, reason:'bad', left:AUTH.MAX_TRIES-acct.failed};
  }
  acct.failed=0; acct.lockedUntil=null; acct.lastSignIn=nowTS();
  await put('account:'+acct.employeeNo, acct);
  return {ok:true, account:acct};
}

function newSession(acct){
  return { name:acct.name, employeeNo:acct.employeeNo, role:acct.role,
           section:acct.section, roleSource:acct.roleSource,
           issuedAt:nowTS(),
           expiresAt:new Date(Date.now()+AUTH.SESSION_MS).toISOString() };
}
const sessionLive = s => !!(s && s.expiresAt && new Date(s.expiresAt) > new Date());

function pwProblem(pw, confirm){
  if(pw.length < AUTH.MIN_PW) return `Password must be at least ${AUTH.MIN_PW} characters.`;
  if(pw !== confirm)          return 'The two passwords do not match.';
  return null;
}

          : {text:'Employee number or password is incorrect.'+
                  (r.left!=null?' '+r.left+' attempt(s) left before lockout.':''),bad:true};
        return renderAuth(app);
      }
      session = newSession(r.account);
      await put('session', session);
      shift = newShift(); await put('shift:current', shift);
      authMsg=null; stage='reentry'; renderShell();
    };
    app.querySelector('#doSignin').onclick=submit;
    enter('iNo',submit); enter('iPw',submit);
  }
}

   REWORK 2, note 2: the board is now OPTIONAL. Where it is unavailable
   the technician enters the face parameters by hand instead. Blast
   number and hardness were struck off the list and are not collected.

   That is a real loosening and it is worth naming: a hand-entered face
   has not been cleared by the re-entry system, so the gas-safety and
   re-entry checks that gate the board do not apply to it. The app
   records which way a face arrived (place.source) so a reviewer can

  </div>

  <button class="btn" id="aGo" ${canPass?'':'disabled'}>
    ${!readyDone?'End readiness outstanding — §9.2'
      :ACK.areaSafe===false?'Blocked — area not made safe'
      :!safe?'Miner must be named'
      :passed?'Update and continue to face log':'Continue to face log'}</button>`;

  main.querySelectorAll('[data-rd]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.rd;
    ACK.readiness[k] = ACK.readiness[k]===true ? undefined : true; render(); });
  main.querySelectorAll('#aTeam .chip').forEach(b=>b.onclick=()=>{
    const r=b.dataset.r;
    ACK.team = ACK.team.includes(r) ? ACK.team.filter(x=>x!==r) : ACK.team.concat([r]);
    render(); });
  main.querySelectorAll('#aSafe .chip').forEach(b=>b.onclick=()=>{
    ACK.areaSafe = b.dataset.s==='yes'; render(); });
  main.querySelector('#aMiner').oninput=e=>{ ACK.miner=e.target.value; render(); };

  main.querySelector('#aGo').onclick=async()=>{
    /* Re-checked here, not only on the button: a disabled button is a
       courtesy, the gate is the condition. */
    if(!READINESS.every(x=>ACK.readiness[x[0]]===true)){
      flash('End readiness is a hard gate — §9.2',true); return; }
    if(ACK.areaSafe!==true){ flash('Blocked — the area is not declared made safe',true); return; }
    if(ACK.miner.trim()===''){ flash('Name the miner',true); return; }
    shift.ack = {readiness:{...ACK.readiness}, team:ACK.team.slice(),
                 areaSafe:true, miner:ACK.miner.trim(), at:nowTS(), by:session.name};
    await put('shift:current',shift);
    setView('facelog');   /* seamless transition to the next page — note 3 */
  };
}

/* ═══ 12 · FACE LOG ═══════════════════════════════════════════════════

   REWORK 2, note 3 and the design notes. The face log is now only the
   measurements. Readiness, team and the miner acknowledgement moved to

   Removed on instruction: XRF reading, the design-cut H/W and F/W pair.

   channel id, TARP class.

   sampling rather than merely warned about. It still records either
   way — a face 11 m off its channel is a real face, and the problem
   with it is what a geologist needs to see. Refusing it would lose the
   observation and the problem together.
   ═══════════════════════════════════════════════════════════════════ */

const CHANNEL_FLAG_M = 9;

let FL = null;   // working face log state, so a part-typed log survives a re-render

/* ═══ 14 · BLAST OFFSET RECORD ════════════════════════════════════════

   THE CORE MODULE.

   An "offset" here is the deviation of the blasted profile from the
   design cut — over-break and under-break caused by the blast. It is not
   geological displacement; faults and dykes are recorded separately under
   Structures.

   Every reading is CENTIMETRES, as read off the tape.

   REWORK 2, note 6 — TWO ROUNDS. The traverse is walked twice: once
   standing 2 m from the face, then the same stations again at 5 m.
   Both rounds must be complete before the record can be saved. The
   earlier build read "the 2 m and 5 m offsets" as two mandatory
   stations inside a single traverse; the handwritten notes correct
   that. Tape set-up confirmation was removed on the same instruction.

   Station spacing inside a round is unchanged: 1 m, the first 1 m off
   the sidewall, no station zero, count = face length − 1.

   F/W readings are always negative — the footwall is below the BMSZ
   datum. The keypad enforces the sign rather than trusting it.

   Waste tonnage is NOT calculated. The notes give
   V = face length × mining height × ?, then × 3.21 S.G., and the third
   term was crossed out. An unconfirmed formula that produces a tonnage
   figure is worse than no figure, so it is left unbuilt.               */

let OS = null;    // working offset set

function blankStations(n){
  return Array.from({length:n},()=>({hw:'',fw:'',cause:'',note:''}));
}

function newOffsetSet(){
  const lim = LIMITS[place.headingType];
  const n   = stationCount(place.faceLength);
  const set = { interval:STATION_INTERVAL_M, headingType:place.headingType,
    faceLength:place.faceLength,
    /* Snapshot of the limit set that judged this face — rework §7.
       A limit revised next year must not silently restate what an old
       face was measured against. */
    hwLimit:lim.hw, fwLimit:lim.fw,
    limitVersion:LIMIT_SET.version, limitLabel:lim.label,
    rounds:{}, round:ROUNDS[0].key, active:0, field:'hw' };
  ROUNDS.forEach(r=>{ set.rounds[r.key]=blankStations(n); });
  return set;
}

const curStations = () => OS.rounds[OS.round];
const roundMeta   = key => ROUNDS.find(r=>r.key===key);

/* Every aggregate is derived here and nowhere else, from the stations and
   the snapshotted limits. Rework §7 has a server recompute these at
   ingest rather than take them on the word of a handset; this build has
   no server, so the figures any report shows are the ones this function
   returns. See the note in §18. */
function statsFor(stations, hwLimit, fwLimit){
  let hwB=0,fwB=0,done=0,overHW=0,overFW=0,hws=[],fws=[],heights=[];
  const planned = hwLimit - fwLimit;
  stations.forEach(s=>{
    const hw=num(s.hw), fw=num(s.fw);
    if(hw!=null&&hw>hwLimit){ hwB++; overHW+=hw-hwLimit; }
    /* F/W excess is how far BELOW the footwall limit the reading sits. */
    if(fw!=null&&fw<fwLimit){ fwB++; overFW+=fwLimit-fw; }
    if(hw!=null) hws.push(hw);
    if(fw!=null) fws.push(fw);
    if(hw!=null&&fw!=null){ done++; heights.push(hw-fw); }
  });
  const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const meanH = mean(heights);
  return {hwB, fwB, done, total:stations.length, planned,
          meanOver: hwB?overHW/hwB:0,
          /* REWORK 2 — mean F/W excess in cm, asked for by name. */
          meanOverFW: fwB?overFW/fwB:0,
          meanHW: mean(hws), meanFW: mean(fws), meanHeight: meanH,
          /* REWORK 2 removed the height range — "better to remove". */
          heightFlag: heights.some(h=>h>HEIGHT_FLAG_CM),
          overCut: meanH!=null&&planned>0 ? ((meanH-planned)/planned)*100 : null};
}

function roundStats(key){
  return statsFor(OS.rounds[key], OS.hwLimit, OS.fwLimit);
}
/* Both rounds pooled — the headline figure for the shift report. */
function osStats(){
  const all = ROUNDS.reduce((a,r)=>a.concat(OS.rounds[r.key]),[]);
  return statsFor(all, OS.hwLimit, OS.fwLimit);
}
/* Which rounds are not yet fully read. */
function roundsOutstanding(){
  return ROUNDS.filter(r=>{
    const st=OS.rounds[r.key];
    return st.some(s=>num(s.hw)==null || num(s.fw)==null);
  });
}

/* All axis values are centimetres. Nothing here converts to metres. */
function sectionSVG(){
  const stations = curStations();
  const W=900,H=340,PL=64,PR=22,PY=30;
  const top=Math.max(OS.hwLimit+60, ...stations.map(s=>num(s.hw)||0))+35;
  const bot=Math.min(OS.fwLimit-40, ...stations.map(s=>num(s.fw)||0))-25;
  const n=Math.max(stations.length,2);
  const X=i=>n===1?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(n-1);
  const Y=v=>PY+((top-v)/(top-bot))*(H-PY*2-24);
  const line=(sel)=>{let d='',open=false;
    stations.forEach((s,i)=>{const v=num(s[sel]); if(v==null){open=false;return;}
      d+=(open?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)+' '; open=true;}); return d;};
  const ticks=[]; for(let v=Math.ceil(top/50)*50; v>=bot; v-=50) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="Face section in centimetres for ${esc(roundMeta(OS.round).label)}, showing hangingwall and footwall offsets against design limits">
    ${ticks.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2A2418"/>
      <text x="${PL-10}" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="#756C58"
        font-family="monospace">${v}</text>`).join('')}
    <rect x="${PL}" y="${Y(OS.hwLimit)}" width="${W-PL-PR}" height="${Math.max(0,Y(OS.fwLimit)-Y(OS.hwLimit))}"
      fill="#5FB87A" opacity="0.07"/>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(OS.hwLimit)}" y2="${Y(OS.hwLimit)}" stroke="#E04A2F"
      stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="${W-PR}" y="${Y(OS.hwLimit)-9}" text-anchor="end" font-size="13" fill="#E04A2F"
      font-family="monospace" letter-spacing="1">DESIGN CUT — H/W ${OS.hwLimit} cm</text>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(OS.fwLimit)}" y2="${Y(OS.fwLimit)}" stroke="#E04A2F"
      stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="${W-PR}" y="${Y(OS.fwLimit)+20}" text-anchor="end" font-size="13" fill="#E04A2F"
      font-family="monospace" letter-spacing="1">DESIGN CUT — F/W ${OS.fwLimit} cm</text>
    <line x1="${PL}" x2="${W-PR}" y1="${Y(0)}" y2="${Y(0)}" stroke="#FFC61A" stroke-width="4"/>
    <text x="${PL+6}" y="${Y(0)-11}" font-size="14" fill="#FFC61A" font-weight="700"
      font-family="monospace" letter-spacing="2">BMSZ</text>
    <path d="${line('hw')}" fill="none" stroke="#F2ECDD" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${line('fw')}" fill="none" stroke="#B0A692" stroke-width="2.5" stroke-linejoin="round"/>
    ${stations.map((s,i)=>{
      const hw=num(s.hw),fw=num(s.fw),on=i===OS.active;
      const hb=hw!=null&&hw>OS.hwLimit, fb=fw!=null&&fw<OS.fwLimit;
      return `${on?`<rect x="${X(i)-19}" y="${PY-6}" width="38" height="${H-PY*2-16}" fill="#FFC61A" opacity="0.09"/>`:''}
        ${hw!=null?`<circle cx="${X(i)}" cy="${Y(hw)}" r="${on?9:6.5}" fill="${hb?'#E04A2F':'#5FB87A'}" stroke="#100E0A" stroke-width="2.5"/>`:''}
        ${fw!=null?`<circle cx="${X(i)}" cy="${Y(fw)}" r="${on?9:6.5}" fill="${fb?'#E04A2F':'#5FB87A'}" stroke="#100E0A" stroke-width="2.5"/>`:''}
        <text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="13" font-family="monospace"
          fill="${on?'#FFC61A':'#756C58'}" font-weight="${on?700:400}">${stationDist(i)}</text>`;
    }).join('')}
    <text x="${PL}" y="${H-8}" font-size="12" fill="#756C58" font-family="monospace"
      text-anchor="end" transform="translate(-14,0)">m</text>
  </svg>`;
}

/* F/W is always negative. Applied on entry so a mis-keyed sign cannot
   reach the record, rather than validated afterwards. */
function forceNegative(v){
  const t=String(v);
  if(t===''||t==='-') return t;
  return t.startsWith('-') ? t : '-'+t;
}

function renderOffsets(main){
  if(!OS) OS=newOffsetSet();
  const stations=curStations();
  const S=roundStats(OS.round);
  const cur=stations[OS.active];

  const saved=cache.offsetSet.filter(e=>e.shiftId===shift.id);
  const outstanding=roundsOutstanding();
  const meta=roundMeta(OS.round);

  main.innerHTML=`
  <div class="eyebrow">Stage 3 · at the face — core record</div>
  <h2 class="title">Blast offset record</h2>
  <p class="sub">Deviation of the blasted profile from the design cut. Over-break and under-break

      <div><label class="f">Heading type — sets the design cut</label>

          `<option value="${k}" ${OS.headingType===k?'selected':''}>${esc(v.label)} · ${v.hw} / ${v.fw} cm</option>`).join('')}</select></div>
    </div>
    <p class="hint">Reading <b>${esc(meta.label)}</b>. The same ${stations.length} stations are

  <div class="svgbox">${sectionSVG()}

      <span><i style="background:#5FB87A;border-radius:50%;height:10px;width:10px"></i>Within cut</span>
      <span><i style="background:#E04A2F;border-radius:50%;height:10px;width:10px"></i>Over-break</span>
    </div>
  </div>

  <div class="grid g2" style="align-items:start">
    <div class="card ${bad?'hot':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px">
        <div><div class="clause">STATION · ${esc(meta.label)}</div>
          <div class="mononum" style="font-size:30px;font-weight:700">${stationDist(OS.active)} m</div></div>
        <div style="display:flex;gap:10px">
          <button class="btn ghost sm" id="prev" ${OS.active===0?'disabled':''} style="width:64px">◀</button>
          <button class="btn ghost sm" id="next" ${OS.active===stations.length-1?'disabled':''} style="width:64px">▶</button>
        </div>
      </div>
      <button class="field ${OS.field==='hw'?'act':''} ${hb?'bad':''}" data-fld="hw">
        <div class="fl"><span>BMSZ → hangingwall (cm)</span><span>limit ${OS.hwLimit}</span></div>
        <div class="fv" style="color:${hw==null?'#3A3325':hb?'#E04A2F':'#F2ECDD'}">${cur.hw||'———'}</div>
        <div class="fs" style="color:${hb?'#E04A2F':'#5FB87A'}">${hw==null?'':hb?('OVER-BREAK +'+(hw-OS.hwLimit)+' cm'):'WITHIN CUT'}</div>
      </button>
      <button class="field ${OS.field==='fw'?'act':''} ${fb?'bad':''}" data-fld="fw">
        <div class="fl"><span>BMSZ → footwall (cm) · always negative</span><span>limit ${OS.fwLimit}</span></div>
        <div class="fv" style="color:${fw==null?'#3A3325':fb?'#E04A2F':'#F2ECDD'}">${cur.fw||'———'}</div>
        <div class="fs" style="color:${fb?'#E04A2F':'#5FB87A'}">${fw==null?'':fb?('OVER-BREAK +'+(OS.fwLimit-fw)+' cm'):'WITHIN CUT'}</div>
      </button>
      ${hw!=null&&fw!=null?`<div style="display:flex;gap:22px;padding:6px 4px;flex-wrap:wrap">
        <div><div class="clause">MINING HEIGHT</div>
          <div class="mononum" style="font-size:22px;color:${(hw-fw)>HEIGHT_FLAG_CM?'#E04A2F':'#F2ECDD'}">${hw-fw} cm</div></div>
        <div><div class="clause">VS DESIGN</div>
          <div class="mononum" style="font-size:22px;color:${(hw-fw)-S.planned>0?'#E04A2F':'#5FB87A'}">
            ${((hw-fw)-S.planned>=0?'+':'')+((hw-fw)-S.planned)} cm</div></div>
      </div>`:''}
      ${bad?`<div class="note stop" style="margin:14px 0 0"><span class="mk">!</span><div>

        <label class="f" style="margin-top:14px">Cause of over-break</label>

/* ═══ 15 · STRUCTURES ═════════════════════════════════════════════════

   REWORK 2, note 7 — FACE PHOTO WITH MARK-UP. The technician takes a
   photo of the face and draws on it: waste patches, geological
   features. It travels with the structure record so a geologist can see
   what was meant.

   This reverses "No photography. Removed on instruction. Do not
   reintroduce." from the earlier brief. Same §7.3 authorisation chain
   as the rest of REWORK 2.

   No library: capture is a plain file input, mark-up is a 2D canvas,
   and the result is a JPEG data URL. Downscaled to 1280 px on the long
   edge at quality 0.72 — a full-resolution tablet photo per structure
   would fill the device store long before the shift ended, and these
   are read at a glance, not zoomed into.

   The photo is an ADDITION to the written record, never a replacement.
   Type, strike, dip and distance are still required; a drawing is not
   a measurement.                                                       */

const PHOTO_MAX_PX = 1280;
const PHOTO_QUALITY = 0.72;

/* Working mark-up state. Kept outside the render so a part-drawn face
   survives a re-render. */
let PHOTO = null;   // {src, strokes:[[{x,y},…]], colour}
const PHOTO_COLOURS = [
  ['#E04A2F','Waste / over-break'],
  ['#FFC61A','BMSZ'],
  ['#54A296','Structure'],
];

function loadPhotoFile(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('Could not read that file.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('That file is not an image.'));
      img.onload=()=>{
        const scale=Math.min(1, PHOTO_MAX_PX/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',PHOTO_QUALITY));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Burns the strokes into the photo so the saved record is one image —
   nothing downstream has to know how to replay a stroke list. */
function flattenPhoto(){
  return new Promise(resolve=>{
    if(!PHOTO||!PHOTO.src) return resolve(null);
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.width; c.height=img.height;
      const x=c.getContext('2d');
      x.drawImage(img,0,0);
      x.lineCap='round'; x.lineJoin='round';
      x.lineWidth=Math.max(3, Math.round(img.width/240));
      PHOTO.strokes.forEach(st=>{
        if(st.pts.length<2) return;
        x.strokeStyle=st.colour;
        x.beginPath();
        st.pts.forEach((p,i)=>{ const px=p.x*img.width, py=p.y*img.height;
          i?x.lineTo(px,py):x.moveTo(px,py); });
        x.stroke();
      });
      resolve(c.toDataURL('image/jpeg',PHOTO_QUALITY));
    };
    img.src=PHOTO.src;
  });
}

/* Draws the photo plus every stroke, and handles pointer input.
   Stroke points are stored 0..1 relative to the image so the drawing
   survives a resize or a re-render at a different width. */
function wirePhotoCanvas(cv, main){
  const img=new Image();
  img.onload=()=>{
    cv.width=img.width; cv.height=img.height;
    cv.style.width='100%'; cv.style.height='auto';
    paint();
  };
  img.src=PHOTO.src;

  const ctx=cv.getContext('2d');
  function paint(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.lineWidth=Math.max(3, Math.round(cv.width/240));
    PHOTO.strokes.forEach(st=>{
      if(st.pts.length<2) return;
      ctx.strokeStyle=st.colour;
      ctx.beginPath();
      st.pts.forEach((p,i)=>{ const px=p.x*cv.width, py=p.y*cv.height;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
      ctx.stroke();
    });
  }

  let drawing=false;
  const at=ev=>{
    const r=cv.getBoundingClientRect();
    return {x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height};
  };
  cv.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    drawing=true;
    /* Capture is a convenience — if the browser refuses it, the stroke
       still has to start. Never let it swallow the first point. */
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    PHOTO.strokes.push({colour:PHOTO.colour, pts:[at(ev)]});
    paint();
  });
  cv.addEventListener('pointermove',ev=>{
    if(!drawing) return;
    PHOTO.strokes[PHOTO.strokes.length-1].pts.push(at(ev));
    paint();
  });
  const stop=()=>{ drawing=false; };
  cv.addEventListener('pointerup',stop);
  cv.addEventListener('pointercancel',stop);
  cv.addEventListener('pointerleave',stop);

  main.querySelectorAll('#pColour .chip').forEach(b=>b.onclick=()=>{
    PHOTO.colour=b.dataset.col; render(); });
  main.querySelector('#pUndo').onclick=()=>{ PHOTO.strokes.pop(); paint(); };
  main.querySelector('#pClear').onclick=()=>{ PHOTO.strokes=[]; paint(); };
  main.querySelector('#pDrop').onclick=()=>{ PHOTO=null; render(); };
}

function bindStructureSave(main){
